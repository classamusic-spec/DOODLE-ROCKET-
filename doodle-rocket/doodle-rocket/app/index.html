  1:[
    {q:"What tool tells how hot or cold the air is?", a:"A thermometer", w:["A rain gauge","A wind sock"], why:"A thermometer measures temperature. On many thermometers, a line rises as it gets warmer and drops as it gets cooler."},
    {q:"What does a rain gauge measure?", a:"How much rain fell", w:["How windy it is","How hot it is"], why:"A rain gauge is a tube that catches rain. Lines on the side show how much rain has fallen.", pic:"drop"},
    {q:"What does a wind sock show?", a:"Which way the wind blows", w:["How much rain fell","How cold it is"], why:"A wind sock fills with air and points the way the wind is blowing. When it sticks straight out, the wind is strong.", pic:"kite"},
    {q:"What are clouds made of?", a:"Tiny water drops or ice", w:["Puffs of smoke","Bits of sand"], why:"Clouds are made of billions of tiny water drops or bits of ice. When the drops join and get heavy, they fall as rain.", pic:"cloud"},
    {q:"In which season are the days the shortest?", a:"Winter", w:["Summer","Spring"], why:"In winter, the Sun rises late and sets early. That is why it can get dark before dinner."},
    {q:"As spring goes on, how does the daytime change?", a:"It gets longer", w:["It gets shorter","It stays the same"], why:"In spring, each day has a bit more daylight than the day before. The longest days of the year come in summer.", pic:"flower"},
    {q:"It is snowy and cold outside. What should you wear?", a:"A warm coat and mittens", w:["A tank top and shorts","A swimsuit and sandals"], why:"Warm layers hold in your body heat. A hat and mittens help keep your head and hands cozy, too.", pic:"snowflake"},
    {q:"It is a hot, sunny day. What should you put on before playing outside?", a:"A hat and sunscreen", w:["A winter coat","A scarf and mittens"], why:"Strong sunlight can burn your skin. Sunscreen, a hat, and shade help protect you, and drinking water helps you stay cool.", pic:"sunglasses"},
    {q:"What should you bring on a rainy day?", a:"An umbrella", w:["A sled","A beach ball"], why:"An umbrella and a raincoat help keep you dry. Boots keep your feet dry when you splash in puddles.", pic:"raincloud"},
    {q:"You hear thunder while playing outside. What should you do?", a:"Go inside", w:["Stand under a tree","Keep playing"], why:"Thunder means lightning is nearby. When thunder roars, go indoors and stay there until the storm has passed.", pic:"ear"},
    {q:"Why do families check the weather forecast?", a:"To plan for the weather", w:["To make the rain stop","To change the season"], why:"A forecast tells what the weather will probably be like. It helps people plan what to wear and get ready for storms.", pic:"umbrella"},
    {q:"How can you tell it is windy outside?", a:"The branches are swaying", w:["The ground is wet","The sky is blue"], why:"You cannot see the wind, but you can see what it does. Wind moves leaves, flags, and kites.", pic:"flag"},
    {q:"What happens to puddles when the Sun comes out?", a:"They slowly dry up", w:["They freeze","They get bigger"], why:"The Sun warms the water, and it slowly rises into the air as a gas you cannot see.", pic:"sun"},
    {q:"When does snow fall instead of rain?", a:"When it is very cold", w:["When it is warm","When there are no clouds"], why:"When it is cold enough up in the clouds, tiny ice crystals form and grow. They clump together and fall as snowflakes.", pic:"snowflake"},
    {q:"When are you most likely to see a rainbow?", a:"When sunlight hits rain", w:["On a dark, cloudy night","During a snowstorm"], why:"Sunlight shining through raindrops splits into colors. To spot a rainbow, stand with the Sun behind you.", pic:"rainbow"},
  ],
  2:[
    {q:"What do we call land that has water all around it?", a:"An island", w:["A valley","A canyon"], why:"An island is surrounded by water on every side. Some islands are tiny, and some are big enough for whole cities."},
    {q:"What is the low land between hills or mountains called?", a:"A valley", w:["A peak","An island"], why:"A valley is a low area between hills or mountains. Many valleys have a river or stream running through them.", pic:"mountain"},
    {q:"Which landform is a wide, flat area of land?", a:"A plain", w:["A mountain","A canyon"], why:"Plains are wide and mostly flat. Many plains have rich soil, which makes them good places for farms."},
    {q:"Which landform rises highest above the land around it?", a:"A mountain", w:["A hill","A valley"], why:"Mountains are much taller than hills. Some are so tall that snow stays on their tops all year."},
    {q:"What is the hot, melted rock that flows out of a volcano called?", a:"Lava", w:["Sand","Clay"], why:"Underground, melted rock is called magma. Once it flows out of a volcano, it is called lava, and it cools into new rock.", pic:"volcano"},
    {q:"Which body of water flows downhill in a long path?", a:"A river", w:["A pond","A lake"], why:"Rivers flow downhill from high places, like mountains, toward lakes or the ocean.", pic:"boat"},
    {q:"How is a pond different from a lake?", a:"A pond is smaller", w:["A pond is salty","A pond flows downhill"], why:"Ponds and lakes both have land all around them. Ponds are smaller and shallower, so sunlight can often reach the bottom.", pic:"duck"},
    {q:"Which body of water is salty?", a:"An ocean", w:["A river","A pond"], why:"Ocean water is salty. Most rivers, ponds, and lakes hold fresh water, which is not salty.", pic:"fish"},
    {q:"What is water called when it freezes solid?", a:"Ice", w:["Steam","Rain"], why:"When water gets cold enough, it freezes into solid ice. When ice warms up, it melts back into liquid water.", pic:"thermometer"},
    {q:"Where on Earth does water stay frozen all year long?", a:"Near the North and South Poles", w:["In rainforest rivers","In warm ocean bays"], why:"The Arctic and Antarctica stay cold all year, so much of their water is frozen. Very tall mountaintops can have ice all year, too.", pic:"globe"},
    {q:"The Grand Canyon was carved by a river. About how long did that take?", a:"Millions of years", w:["One day","Ten years"], why:"The Colorado River wore away rock little by little. Changes this slow are too small to notice in a day.", pic:"rock"},
    {q:"Which of these can change the land in just a few minutes?", a:"An earthquake", w:["A river carving a canyon","A glacier carving a valley"], why:"Most changes to land are very slow, but some are fast. Earthquakes, landslides, and volcanoes can change land quickly."},
    {q:"How can wind change the shape of the land?", a:"It blows sand away", w:["It turns rock to water","It makes new volcanoes"], why:"Wind picks up bits of sand and soil and drops them somewhere else. In deserts, wind piles sand into hills called dunes.", pic:"kite"},
    {q:"How can people keep soil on a hill from washing away?", a:"Plant grass and trees", w:["Pull up all the plants","Pour water down the hill"], why:"Plant roots hold soil in place like a net. Walls and fences can also help keep soil from sliding or blowing away.", pic:"raincloud"},
    {q:"On many maps, what color shows water?", a:"Blue", w:["Green","Brown"], why:"Mapmakers often use blue for oceans, lakes, and rivers. Green and brown often show land.", pic:"map"},
  ],
  3:[
    {q:"Which sentence describes a place's climate?", a:"Summers here are usually hot", w:["It is raining right now","It will be windy tomorrow","It snowed last night"], why:"Weather is what the air is like at one time. Climate is the usual pattern of weather in a place over many years.", pic:"globe"},
    {q:"It is cloudy and cool this morning. What does this describe?", a:"The weather", w:["The climate","The season","The landforms"], why:"Weather is what the air is like at a certain time and place. It can change from hour to hour.", pic:"thermometer"},
    {q:"Which place has a very cold climate?", a:"The South Pole", w:["The Amazon rainforest","The Sahara Desert","The Caribbean islands"], why:"The South Pole is in Antarctica, the coldest place on Earth. Antarctica is also the windiest and driest continent.", pic:"snowflake"},
    {q:"Places near the equator usually have what kind of climate?", a:"Warm all year", w:["Snowy all year","Cold winters with ice","Freezing most days"], why:"Near the equator, the Sun is high in the sky all year. That is why many places there are warm and have no cold winter.", pic:"P:Earth"},
    {q:"Which clouds look like puffy cotton balls on a sunny day?", a:"Cumulus", w:["Cirrus","Stratus","Nimbostratus"], why:"Cumulus clouds are puffy with flat bottoms. If they grow very tall and dark, they can turn into storm clouds.", pic:"cloud"},
    {q:"Which tall, dark clouds bring thunderstorms?", a:"Cumulonimbus", w:["Cirrus","Stratus","Cumulus"], why:"Cumulonimbus clouds can tower miles high. They bring thunder, lightning, heavy rain, and sometimes hail.", pic:"raincloud"},
    {q:"Which clouds are thin, wispy, and very high in the sky?", a:"Cirrus", w:["Cumulus","Stratus","Cumulonimbus"], why:"Cirrus clouds are so high and cold that they are made of ice crystals. They often look like feathers or brush strokes.", pic:"feather"},
    {q:"What falls from a thunderstorm as balls of ice?", a:"Hail", w:["Sleet","Snow","Fog"], why:"Strong winds in a storm cloud carry water drops up high, where they freeze. Hailstones grow in layers, like an onion.", pic:"ice"},
    {q:"Raindrops freeze into tiny ice pellets as they fall. What is this called?", a:"Sleet", w:["Hail","Snow","Dew"], why:"Sleet forms when rain falls through a layer of freezing air near the ground. The drops freeze into little pellets that bounce."},
    {q:"Rain, snow, sleet, and hail are all kinds of what?", a:"Precipitation", w:["Evaporation","Condensation","Erosion"], why:"Precipitation is water that falls from clouds to the ground. Which kind falls depends on how cold the air is.", pic:"umbrella"},
    {q:"A town has hot, rainy summers every year. What will next summer likely be like?", a:"Hot and rainy", w:["Cold and snowy","Cool and dry","Freezing and icy"], why:"Weather records show patterns. Scientists use many years of data to predict what a season will usually be like.", pic:"book"},
    {q:"What do levees help protect towns from?", a:"Floods", w:["Earthquakes","Tornadoes","Droughts"], why:"A levee is a long, raised bank of earth built along a river. It helps keep high water from spilling into nearby towns.", pic:"house"},
    {q:"Where is the safest place to go during a tornado warning?", a:"In a basement or shelter", w:["Next to a big window","Out on the porch","Up in the attic"], why:"The lowest floor, in a room without windows, is safest. Families can practice their plan ahead of time so everyone knows where to go.", pic:"house"},
    {q:"How do weather forecasts help people stay safe?", a:"They warn people early", w:["They stop storms","They make storms smaller","They change the climate"], why:"Forecasters use radar and satellites to spot storms on the way. An early warning gives families time to get ready."},
    {q:"A hurricane may arrive in a few days. What is a smart way to get ready?", a:"Pack water, food, and flashlights", w:["Open all the windows","Stay close to the beach","Wait until the storm starts"], why:"Families pack a kit with water, food, flashlights, and batteries. They also listen to local leaders about when to move somewhere safer."},
  ],
  4:[
    {q:"In rock layers that have not been moved, which layer is usually the oldest?", a:"The bottom layer", w:["The top layer","The middle layer","The thinnest layer"], why:"Layers of sand and mud pile up over time, so the bottom ones formed first. This helps scientists tell which fossils are older.", pic:"rock"},
    {q:"Fish fossils lie below fern fossils in rock layers. What does this show?", a:"Water there became dry land", w:["Fish turned into ferns","Ferns grew in the deep sea","Nothing there ever changed"], why:"Fish lived there when water covered the area. Later, the land dried out and ferns grew. Rock layers record changes like this.", pic:"fish"},
    {q:"Fossil ferns and trees have been found in Antarctica. What does this tell us?", a:"It was once much warmer", w:["Ferns grow well on ice","It has always been icy","Fossils form only in ice"], why:"Plants like these need warmth to grow. Long ago, Antarctica had forests, so its climate must have been much warmer.", pic:"leaf"},
    {q:"Water seeps into a crack in a rock and freezes. What happens to the crack?", a:"It gets wider", w:["It gets smaller","It fills with lava","It stays the same"], why:"Water expands when it freezes. The ice pushes the crack wider, and over many winters the rock can split apart.", pic:"ice"},
    {q:"Which of these is an example of weathering?", a:"Roots cracking a rock", w:["Rivers carrying sand","Wind blowing dust away","Waves moving beach sand"], why:"Weathering breaks rock into smaller pieces. Moving those pieces to a new place is called erosion."},
    {q:"After a big storm, a river looks brown and muddy. Why?", a:"It is carrying soil away", w:["The rain was brown","The water got colder","Sunlight turned it brown"], why:"Fast-moving water picks up soil and sand. Carrying bits of rock and soil from one place to another is called erosion.", pic:"raincloud"},
    {q:"How does a moving glacier change the land?", a:"It scrapes and carves rock", w:["It builds new volcanoes","It warms up the soil","It fills valleys with lava"], why:"A glacier is a huge, slow-moving mass of ice. As it slides, it scrapes rock and carries boulders, carving out wide valleys.", pic:"snowflake"},
    {q:"On a world map, how are most volcanoes and earthquakes arranged?", a:"In long bands and chains", w:["Spread evenly everywhere","Only near the poles","Only inside continents"], why:"Many volcanoes and earthquakes line up along the edges of the giant plates that make up Earth's surface. One chain circles the Pacific Ocean.", pic:"map"},
    {q:"Where is the longest mountain range on Earth?", a:"Under the ocean", w:["In Asia","In South America","In North America"], why:"The mid-ocean ridge winds around the globe for about 65,000 kilometers. More than 90 percent of it is under the sea.", pic:"mountain"},
    {q:"Which energy source is renewable?", a:"Wind", w:["Coal","Oil","Natural gas"], why:"Renewable sources, like wind, sunlight, and flowing water, will not run out. Coal, oil, and natural gas took millions of years to form.", pic:"lightbulb"},
    {q:"Why are coal, oil, and natural gas called nonrenewable?", a:"They take millions of years to form", w:["They are too heavy to move","They only work in cold places","They are found only in oceans"], why:"They formed from plants and tiny sea life buried long ago. Once we use them up, they cannot be replaced in our lifetime."},
    {q:"Which renewable energy source uses flowing water?", a:"Hydropower", w:["Solar power","Wind power","Geothermal power"], why:"Flowing water spins machines called turbines, which help make electricity. Rain and snow keep refilling the rivers.", pic:"drop"},
    {q:"Burning coal to make electricity can cause which problem?", a:"Air pollution", w:["More sunlight","Taller mountains","Cleaner rivers"], why:"Burning coal, oil, and gas puts smoke and gases into the air. Wind and solar power make electricity without burning fuel."},
    {q:"How can engineers help buildings stay standing in earthquakes?", a:"Make them bend, not break", w:["Make them out of glass","Use bricks with no frame","Make them tall and thin"], why:"Strong frames and flexible parts let buildings move with the shaking. Schools also practice drills so everyone knows how to stay safe.", pic:"house"},
    {q:"How do scientists help people near volcanoes stay safe?", a:"They watch for warning signs", w:["They plug the top","They build a roof over it","They move the mountain"], why:"Scientists measure small earthquakes, gases, and swelling ground. These clues can warn people to leave before an eruption.", pic:"volcano"},
  ],
  5:[
    {q:"The Sun heats a lake, and some water turns into a gas. What is this called?", a:"Evaporation", w:["Condensation","Precipitation","Collection"], why:"During evaporation, liquid water becomes water vapor, an invisible gas. It rises into the air and can later form clouds.", pic:"sun"},
    {q:"Water vapor cools high in the sky and forms clouds. What is this step called?", a:"Condensation", w:["Evaporation","Precipitation","Runoff"], why:"When water vapor cools, it turns back into tiny liquid drops. The same thing makes drops form on a cold glass.", pic:"cloud"},
    {q:"Drops in a cloud join together and get too heavy. What happens next?", a:"They fall as precipitation", w:["They float up into space","They stay up forever"], why:"The air cannot hold up heavy drops, so they fall as rain, or as snow, sleet, or hail when it is cold. This returns water to the ground.", pic:"raincloud"},
    {q:"What powers the water cycle by heating Earth's water?", a:"Energy from the Sun", w:["Light from the Moon","Heat from volcanoes","Energy from wind"], why:"Sunlight warms oceans, lakes, and land so water evaporates. Gravity then pulls rain and snow back down, keeping water moving.", pic:"drop"},
    {q:"What do we call water stored underground in soil and rock?", a:"Groundwater", w:["Runoff","Water vapor","Seawater"], why:"Groundwater is stored in soil and rock underground. Many people get drinking water from wells that reach it."},
    {q:"About how much of Earth's water is salty ocean water?", a:"About 97 percent", w:["About 50 percent","About 20 percent","About 3 percent"], why:"Only about 3 percent of Earth's water is fresh, and most of that is frozen in ice or hidden underground.", pic:"P:Earth"},
    {q:"Where is most of Earth's fresh water found?", a:"In glaciers and ice caps", w:["In rivers","In lakes","In clouds"], why:"About two-thirds of Earth's fresh water is frozen, mostly in Antarctica and Greenland. Most of the rest is underground.", pic:"globe"},
    {q:"Which Earth system includes all the air around our planet?", a:"The atmosphere", w:["The geosphere","The hydrosphere","The biosphere"], why:"The atmosphere is the blanket of gases around Earth. It gives us air to breathe and is where weather happens."},
    {q:"Oceans, lakes, rivers, and groundwater belong to which Earth system?", a:"The hydrosphere", w:["The atmosphere","The geosphere","The biosphere"], why:"Hydro means water. The hydrosphere includes all of Earth's water, from oceans to ice to water underground.", pic:"boat"},
    {q:"Which Earth system includes every plant, animal, and person?", a:"The biosphere", w:["The atmosphere","The geosphere","The hydrosphere"], why:"Bio means life. The biosphere is made up of all living things, from tiny bacteria to giant whales.", pic:"butterfly"},
    {q:"Plant roots crack apart a rock. Which two Earth systems are interacting?", a:"Biosphere and geosphere", w:["Atmosphere and hydrosphere","Hydrosphere and biosphere","Atmosphere and geosphere"], why:"Roots are part of the biosphere, and rock is part of the geosphere. Earth's systems are always affecting one another.", pic:"rock"},
    {q:"Which is a way a community can save fresh water?", a:"Fixing leaky pipes", w:["Watering lawns at noon","Letting faucets run","Washing cars every day"], why:"Small leaks can waste a lot of water over time. Communities also save water by watering plants in the cool morning.", pic:"house"},
    {q:"How does recycling paper help protect Earth's resources?", a:"Fewer trees get cut down", w:["More trash gets made","More trees get used","More oil gets spilled"], why:"Old paper can be made into new paper. That saves trees, water, and energy, and it keeps trash out of landfills.", pic:"book"},
    {q:"Which choice helps keep the air cleaner?", a:"Biking instead of driving", w:["Burning more trash","Leaving car engines running","Using more gasoline"], why:"Cars that burn gasoline give off gases that pollute the air. Walking, biking, and sharing rides all help."},
    {q:"Why should people never pour oil or paint into a storm drain?", a:"It can pollute water", w:["It cleans the drain","It turns into clean rain","It helps plants grow"], why:"Many storm drains carry water straight to rivers, lakes, or the ocean. Harmful liquids there can hurt plants and animals."},
  ],
};

    {q:"Which rock will feel warmest on a sunny afternoon?", a:"A rock in the sunshine", w:["A rock in the shade","A rock in a cool stream"], why:"Sunlight warms the things it shines on. Rocks in the shade or in cool water stay cooler.", pic:"rock"},

    {q:"A bell is ringing. You hold it tight with your hand. What happens?", a:"The sound stops", w:["The sound gets louder","The bell gets hot"], why:"Your hand stops the bell from vibrating. When the shaking stops, the sound stops too.", pic:"hand"},

    {q:"Which one would make the darkest shadow?", a:"A piece of cardboard", w:["A clear plastic cup","A sheet of wax paper"], why:"Cardboard blocks all the light, so its shadow is dark. Clear plastic lets light through, and wax paper lets some through.", pic:"lightbulb"},
    {q:"Which one lets the most light through?", a:"A clear glass window", w:["A wooden door","A brick wall"], why:"Clear glass lets light pass right through. That is why we can see out of a window.", pic:"house"},

  2:[

    {q:"What kind of matter is the air inside a balloon?", a:"A gas", w:["A solid","A liquid"], why:"Air is a gas. A gas spreads out to fill all the space it is in, like the inside of a balloon."},
    {q:"Which kind of matter keeps its own shape?", a:"A solid", w:["A liquid","A gas"], why:"A solid, like a rock or a block, keeps its shape. Liquids and gases take the shape of their container."},
    {q:"Which word best tells how a feather feels?", a:"Soft", w:["Hard","Sticky"], why:"Soft is a property, a word that tells what something is like. Feathers are soft and light.", pic:"feather"},
    {q:"Which one can bend without breaking?", a:"A rubber band", w:["A glass cup","A clay brick"], why:"A rubber band is flexible. It can bend and stretch, then go back to its shape."},

    {q:"A block tower is taken apart. What can you do with the blocks?", a:"Build something new", w:["Only build that tower","Nothing, they are used up"], why:"Things made of small pieces can be taken apart. The same pieces can be put together to make something new.", pic:"house"},
    {q:"How can you turn water back into ice?", a:"Put it in the freezer", w:["Heat it on the stove","Stir it with a spoon"], why:"Melting can be undone. When water gets cold enough, it freezes into ice again.", pic:"ice"},
    {q:"What happens when melted chocolate cools down?", a:"It gets hard again", w:["It turns into milk","It stays runny forever"], why:"Melting chocolate is a change that can be undone. When it cools, it turns back into a solid."},
    {q:"Which change can be undone?", a:"Melting a crayon", w:["Cooking an egg","Baking bread"], why:"Melted crayon wax gets hard again when it cools. A cooked egg or baked bread can never change back.", pic:"thermometer"},
    {q:"Can a cooked egg turn back into a raw egg?", a:"No, it changed for good", w:["Yes, if it cools down","Yes, if you freeze it"], why:"Cooking an egg is a change that cannot be undone. Cooling or freezing it will not make it raw again.", pic:"egg"},
    {q:"What happens to butter in a hot pan?", a:"It melts", w:["It freezes","It gets harder"], why:"Heat makes butter melt from a solid into a liquid. When it cools, it turns solid again."},

  3:[
    {q:"Two teams pull a rope equally hard. What happens to the rope?", a:"It stays in place", w:["It moves toward one team","It speeds up","It starts to spin"], why:"Equal pulls in opposite directions are balanced forces. Balanced forces do not change how something moves.", pic:"hand"},
    {q:"A book rests on a table. Why does it stay still?", a:"The forces are balanced", w:["No forces act on it","Only gravity acts on it","The forces are unbalanced"], why:"Gravity pulls the book down, and the table pushes up just as hard. The forces balance, so the book stays still.", pic:"book"},
    {q:"A still box starts to slide. What must be acting on it?", a:"Unbalanced forces", w:["Balanced forces","No forces at all","Only friction"], why:"Balanced forces cannot start something moving. The box moves when a push or pull in one direction is stronger."},
    {q:"Two magnets have their north ends facing. What will they do?", a:"Push each other away", w:["Pull together and stick","Get very hot","Lose all their magnetism"], why:"Like poles repel, or push apart. Opposite poles, like north and south, attract each other.", pic:"magnet"},
    {q:"Which two magnet ends pull toward each other?", a:"North and south", w:["North and north","South and south"], why:"Opposite poles attract. A north pole and a south pole pull together.", pic:"magnet"},
    {q:"Which of these will a magnet pick up?", a:"An iron nail", w:["A plastic button","A wooden spoon","A piece of aluminum foil"], why:"Magnets attract things made of iron or steel. They do not attract plastic, wood, or aluminum."},
    {q:"Steel clips and plastic beads are mixed up. What could sort them fast?", a:"A magnet", w:["A flashlight","A rubber band","A paper towel"], why:"A magnet attracts the steel clips but not the plastic beads, so it pulls out just the clips."},
    {q:"Which force can act on an object without touching it?", a:"The pull of a magnet", w:["The push of a hand","The kick of a foot","Friction from a rug"], why:"A magnet can pull on iron things from a distance, without touching them. Gravity can too!"},
    {q:"When does a magnet pull hardest on a paper clip?", a:"When they are very close", w:["When they are far apart","When the clip is wet","When the room is dark"], why:"A magnet pulls hardest on things that are close. The pull gets weaker as they get farther apart.", pic:"magnet"},
    {q:"You rub a balloon on your hair. What can the balloon do next?", a:"Stick to a wall", w:["Pop by itself","Turn into a magnet","Get much heavier"], why:"Rubbing gives the balloon a charge of static electricity. The charge lets it cling to a wall without any glue."},
    {q:"Why does a rolling ball slow down on grass?", a:"Friction from the grass", w:["The ball gets lighter","The ball gets colder","Magnets in the grass"], why:"Friction is a force that slows things down when surfaces rub together. Grass makes a lot of friction.", pic:"ball"},
    {q:"With the same push, where will a toy car roll the farthest?", a:"On a smooth floor", w:["On a thick rug","On soft sand","On tall grass"], why:"A smooth floor makes less friction than a rug, sand, or grass, so the car keeps rolling longer.", pic:"car"},

    {q:"Which sentence uses the word \"sea\" the right way?", a:"We swam in the sea.", w:["I can sea the Moon.","Did you sea my cat?","Come and sea my garden."], why:"The sea is a big body of salty water. The word see sounds the same, but it means to look."},
    {s:"Grandma said, \"Let's take steps to keep the bugs off our plants.\"", q:"What does \"take steps\" mean here?", a:"do things to solve a problem", w:["walk around the garden","march in a line","stand on tiptoe"], why:"Here, take steps does not mean walking. It means doing things to solve a problem."},
    {q:"In which sentence does \"bright\" mean smart?", a:"Maya is a bright student.", w:["The Sun is bright today.","This lamp is too bright.","Her shirt is bright red."], why:"A bright student is smart and learns quickly. The other sentences are about light and color."},

    {s:"Dad will preheat the oven before we bake the bread.", q:"What does \"preheat\" mean?", a:"heat before", w:["heat again","not heat","heat too much"], why:"The prefix pre means before. You preheat an oven before you put the food in."},
    {s:"Zed was careless and spilled juice on his drawing.", q:"What does \"careless\" mean?", a:"not careful", w:["very careful","full of care","careful again"], why:"The suffix less means without. Careless means without care, or not careful."},

  4:[

    {s:"Zed was as busy as a bee, getting the rocket ready for launch.", q:"What does \"as busy as a bee\" mean?", a:"working very hard", w:["buzzing loudly","flying around","feeling sick"], why:"Bees are always hard at work. This simile means Zed was working very hard."},
    {s:"Grab your umbrella! It is raining cats and dogs.", q:"What does \"raining cats and dogs\" mean?", a:"raining very hard", w:["animals are out in the rain","raining just a little","the rain has stopped"], why:"Raining cats and dogs is an idiom. It means it is raining very hard."},
    {s:"Leo felt under the weather, so he stayed in bed all day.", q:"What does \"under the weather\" mean?", a:"a little sick", w:["outside in the rain","very excited","very sleepy"], why:"Under the weather is an idiom. It means feeling a little sick."},
    {s:"The spelling test was a piece of cake for Kim.", q:"What does \"a piece of cake\" mean here?", a:"very easy", w:["very tasty","very hard","very long"], why:"A piece of cake is an idiom. It means something is very easy to do."},

  5:[

    {s:"Pip had butterflies in her stomach before her first launch.", q:"What does \"butterflies in her stomach\" mean?", a:"She felt nervous.", w:["She felt hungry.","She felt sleepy.","She felt angry."], why:"Having butterflies in your stomach is an idiom. It means feeling nervous or jittery."},

    {s:"Grandpa visits the big city once in a blue moon.", q:"What does \"once in a blue moon\" mean?", a:"very rarely", w:["every night","when the Moon turns blue","very often"], why:"Once in a blue moon is an idiom. It means something happens very rarely."},

/* ---- the shared multiple-choice engine ---- */
// q = {key, cap, spoken, answer, choices, explain, hint(choice), draw(world, A), s, labels, aria(choice), onRight, onMiss, quietCap}
// A = {x, y, w, h, top, bottom}: the free area between the question card and the answer buttons.
function quiz(alive, q, {keep=false} = {}){
  return new Promise(resolve => {
    world.innerHTML='';
    if (!keep){ const old = $('passage'); if (old) old.remove(); }
    const oldS = $('scard'); if (oldS) oldS.remove();
    const box = $('answers'); box.innerHTML='';
    const long = q.choices.some(c => String(c).length > 15), sym = !long && q.choices.every(c => String(c).length <= 2 && !/^\d+$/.test(c));
    let misses = 0, done = false;
    const btns = q.choices.map((c, i) => {
      const b = h('button', 'ans paper' + (long ? ' long' : sym ? ' sym' : ''));
      b.dataset.v = c; b.style.setProperty('--i', i);
      if (q.labels && q.labels[c]){ b.innerHTML = q.labels[c]; b.setAttribute('aria-label', q.aria ? q.aria(c) : String(c)); }
      else b.textContent = c;
      box.appendChild(b); return b;
    });
    S.q = q;
    const speak = () => { caption(q.cap); return say(q.spoken || q.cap); };
    S.repeat = speak;
    const cap = caption(q.cap);
    const aTop = frameRect(box).top, top = Math.max(TOP, frameRect(cap).bottom + 14);
    const A = {x:W/2, y:(top + aTop)/2, w:W-24, h:Math.max(80, aTop - top - 16), top, bottom:aTop - 10};
    if (q.s) sentenceCard(q, A);
    if (q.draw) q.draw(world, A);
    say(q.spoken || q.cap);
    btns.forEach((b, i) => b.onclick = async () => {
      if (done || !alive() || b.disabled) return; unlockAudio();
      const c = q.choices[i];
      if (c === q.answer){
        done = true; b.classList.add('right');
        btns.forEach(x => { x.classList.remove('pulse'); if (x !== b){ x.disabled = true; x.classList.add('fade'); } });
        sfx.win(); sfx.sparkle(); buzz([10,40,16]); sparkle(...elCenter(b));
        if (q._blank){ q._blank.textContent = String(c); q._blank.classList.add('fill'); }
        if (q.onRight) q.onRight();
        caption(q.good || 'Yes!').classList.add('good');
        await say(q.explain ? `Yes! ${q.explain}` : `Yes! ${c}.`);
        if (!alive()) return;
        await wait(350);
        box.innerHTML=''; const sc = $('scard'); if (sc) sc.remove();
        if (!keep){ const p = $('passage'); if (p) p.remove(); }
        S.repeat = null; resolve();
      } else {
        misses++; b.disabled = true; miss();
        b.classList.add('wiggle-h'); setTimeout(() => b.classList.remove('wiggle-h'), 520);
        if (q.onMiss) q.onMiss(misses);
        if (misses >= 2) btns.forEach((x,j) => { if (q.choices[j]===q.answer) x.classList.add('pulse'); });
        const hint = q.hint ? q.hint(c) : pick(['Not quite. Try again!', 'Good try! Look again.', 'Hmm, not that one. Try again!']);
        caption(q.quietCap ? 'Try again!' : hint);
        await say(hint);
      }
    });
  });
}

function tenFrames(g, cx, cy, cs, cells){
  const frames = Math.max(1, Math.ceil(cells.length/10));
  for (let fi=0; fi<frames; fi++){
    const fx = cx + (fi - (frames-1)/2)*(cs*5 + cs*.8);
    for (let i=0;i<10;i++){
      const r = Math.floor(i/5), c = i%5, x = fx + (c-2)*cs, y = cy + (r-.5)*cs;
      el('rect', {x:f(x-cs/2), y:f(y-cs/2), width:f(cs), height:f(cs), fill:'rgba(255,253,246,.92)', stroke:C.ink, 'stroke-width':2.5}, g);
      const cell = cells[fi*10+i]; if (!cell) continue;
      if (cell.dash){ el('circle', {cx:f(x), cy:f(y), r:f(cs*.32), fill:'none', stroke:C.ink, 'stroke-width':2, 'stroke-dasharray':'3 4'}, g); continue; }
      el('circle', {cx:f(x), cy:f(y), r:f(cs*.34), fill:cell.fill, stroke:C.ink, 'stroke-width':2.5}, g);
      if (cell.cross) line(g, `M${f(x-cs*.3)},${f(y-cs*.3)} L${f(x+cs*.3)},${f(y+cs*.3)}`, C.ink, 4);
    }
  }
}
function drawClock(g, cx, cy, R, hh, mm, fine){
  const G = at(g, cx, cy);
  sketch(G, blob(R,.02,16), {fill:C.paper, sw:5, hatch:false});
  for (let i=0;i<60;i++){
    const big = i%5===0; if (!big && !fine) continue;
    const a = i*Math.PI/30, r1 = R*(big?.83:.89), r2 = R*.94;
    line(G, `M${f(Math.sin(a)*r1)},${f(-Math.cos(a)*r1)} L${f(Math.sin(a)*r2)},${f(-Math.cos(a)*r2)}`, C.ink, big?3:1.3);
  }
  for (let i=1;i<=12;i++){ const a = i*Math.PI/6; txt(G, i, R*.17, {x:Math.sin(a)*R*.68, y:-Math.cos(a)*R*.68}); }
  const ha = ((hh%12) + mm/60)*Math.PI/6, ma = mm*Math.PI/30;
  line(G, `M0,0 L${f(Math.sin(ha)*R*.46)},${f(-Math.cos(ha)*R*.46)}`, C.ink, R*.075);
  line(G, `M0,0 L${f(Math.sin(ma)*R*.76)},${f(-Math.cos(ma)*R*.76)}`, C.tomato, R*.045);
  el('circle', {r:f(R*.06), fill:C.ink}, G);
  return G;
}

/* Graph galaxy: 1.MD.4 · 2.MD.10 · 3.MD.3 · 4 (scaled bars) · 5.G.2 (line graph) */
const GRAPH_SETS = [
  {title:'Favorite planets', unit:'kids', cats:['Mars','Earth','Saturn','Jupiter']},
  {title:'Space snacks', unit:'votes', cats:['cookies','apples','pizza','grapes']},

function qGraphs(g){

  let vals; do { vals = cats.map(() => randInt(1, g===1 ? 7 : 9) * scale); } while (new Set(vals).size < k);
  const t = g===1 ? randInt(0,2) : randInt(0,3), i = randInt(0, k-1); let j = randInt(0, k-1); while (j === i) j = randInt(0, k-1);

  if (t===0){ cap = `How many ${set.unit} chose ${cats[i]}?`; if (set.cats[0] === 'Mon') cap = `How many stars were spotted on ${cats[i]}?`; ans = String(vals[i]); explain = `The bar for ${cats[i]} reaches ${vals[i]}.`; wr = near(vals[i], [scale, -scale, 1, 2*scale]).map(String); }
  else if (t===1){ const most = Math.random() < .6; cap = most ? 'Which one has the most?' : 'Which one has the least?'; ans = cats[most ? maxI : minI]; explain = `${ans} has the ${most ? 'tallest' : 'shortest'} bar, ${vals[most ? maxI : minI]}.`; wr = cats.filter(c => c !== ans); }
  else if (t===2){ const [a, b] = vals[i] > vals[j] ? [i, j] : [j, i]; cap = `How many more for ${cats[a]} than ${cats[b]}?`; ans = String(vals[a] - vals[b]); explain = `${vals[a]} minus ${vals[b]} is ${vals[a] - vals[b]}.`; wr = near(vals[a] - vals[b], [scale, -scale, vals[b]]).concat([vals[a] + vals[b]]).map(String); }
  else { cap = `How many for ${cats[i]} and ${cats[j]} together?`; ans = String(vals[i] + vals[j]); explain = `${vals[i]} plus ${vals[j]} is ${vals[i] + vals[j]}.`; wr = near(vals[i] + vals[j], [scale, -scale, 10]).concat([Math.abs(vals[i] - vals[j])]).map(String); }
  const q = {key:`gr${cap}${vals}`, cap, spoken:`Look at the graph: ${set.title}. ${cap}`, answer:ans, choices:mc(ans, wr, g===1 ? 3 : 4), explain,

function barGraph(w, A, title, cats, vals, scale, pictures){

  for (let s=0; s<=steps; s++){ const y = y0 - s*uh; el('path', {d:`M${f(x0)},${f(y)} L${f(x0 + cw*k)},${f(y)}`, stroke:'rgba(255,253,246,.25)', 'stroke-width':1.5}, w);
    if (steps <= 10 || s % 2 === 0) txt(w, s*scale, clamp(uh*.5, 11, 17), {fill:C.paper, x:x0 - 16, y}); }

function qLineGraph(){

// Turns a CONTENT bank item into a quiz question. fb = a fallback picture when the item has none.
function bankQ(it, fb){
  const q = {key:(it.s || '') + '|' + it.q, cap:it.q, spoken:(it.s ? it.s.replace(/_{2,}/g, 'blank') + ' ... ' : '') + it.q,
    answer:it.a, choices:shuffle([it.a, ...it.w]), explain:it.why, s:it.s || null};

}
function qBank(bank, g, fb){ const B = CONTENT[bank]; return bankQ(pick(B[nearestG(B, g)]), fb); }
function drawPic(w, A, pic){

  const R = clamp(Math.min(A.w, A.h)*.36, 40, 120), t = thing(w, W/2, A.y); t.inner.classList.add('bob');

        const played = ks.filter(k => readStat(who, k) && readStat(who, k).r > 0), fresh_ = ks.filter(k => !played.includes(k));
        const st = played.map(k => mastery(readStat(who, k)));
        const summary = !played.length ? 'Not started yet' : st.every(s => s==='got') ? 'Got it!' : st.some(s => s==='got' || s==='close') ? 'Coming along' : 'Practicing';
        const h4 = h('h4', null, `${SUBJECTS[sub].name}`); h4.appendChild(h('span', 'st ' + (summary==='Got it!' ? 'got' : summary==='Coming along' ? 'close' : played.length ? 'prac' : 'new'), summary));
        if (lv !== who.level) h4.appendChild(h('span','st new', levelName(lv)));
        box.appendChild(h4);
        played.forEach((k, i) => { const r = h('div','grow'); const s = readStat(who, k);
          r.append(h('span', null, `${GAMES[k].name} · ${s.f}/${s.r} first try`), h('span', 'st ' + st[i], MASTERY[st[i]])); box.appendChild(r); });
        if (fresh_.length) box.appendChild(h('p','hint', `Not tried yet: ${fresh_.map(k => GAMES[k].name).join(', ')}.`));
        const li = LEVEL_IDS.indexOf(lv);
        if (played.length >= 2 && st.filter(s => s==='got').length >= Math.min(3, played.length) && li < LEVEL_IDS.length - 1 && isGrade(LEVEL_IDS[li+1])){
          const up = h('button','opt', `Ready for more? Move ${SUBJECTS[sub].name} to ${levelName(LEVEL_IDS[li+1])}`);
          up.onclick = () => { who.subj[sub] = LEVEL_IDS[li+1]; save(); render(); }; box.appendChild(up);
        }
        box.appendChild(h('div','idea', 'Off-screen idea: ' + pick(IDEAS[sub])));
        sh.appendChild(box);
      });
    }
    if (tab === 'learning'){
      if (!who){ sh.appendChild(h('p', null, 'No explorers yet.')); return; }
      whoPicker();
      sh.appendChild(h('h3', null, `${displayName(who)}'s level`));
      const seg = h('div','seg');
      LEVELS.forEach(([v, t]) => { const b = h('button','opt', t); b.setAttribute('aria-pressed', String(who.level===v)); b.onclick = () => { who.level = v; if (who===S.profile) setLevel(v); who.page = null; save(); render(); }; seg.appendChild(b); });
      sh.appendChild(seg);
      sh.appendChild(h('p','hint', LEVEL_BLURB[who.level] + '. Grade levels open the Big Kid Galaxy; younger levels open the Little Explorer Galaxy.'));
      sh.appendChild(h('h3', null, 'Level by subject'));
      sh.appendChild(h('p','hint', 'Homeschoolers often work at different levels in different subjects. Leave these on "Same" to follow the main level.'));
      ['math','reading','science','social'].forEach(sub => {
        const r = h('div','sw2'); r.appendChild(h('span', null, SUBJECTS[sub].name));
        const sel = document.createElement('select'); sel.className = 'opt'; sel.setAttribute('aria-label', `${SUBJECTS[sub].name} level`);
        [['', `Same (${levelName(who.level)})`], ...LEVELS].forEach(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; if ((who.subj[sub] || '') === v) o.selected = true; sel.appendChild(o); });
        sel.onchange = () => { if (sel.value) who.subj[sub] = sel.value; else delete who.subj[sub]; save(); };
        r.appendChild(sel); sh.appendChild(r);
      });
      sh.appendChild(h('h3', null, "Today's trip"));
      choice('Stops per day', [[3,'3'],[4,'4'],[5,'5']], DB.settings.tripLen, v => { DB.settings.tripLen = v; });
      toggle('Rest after the trip', DB.settings.tripStop, v => DB.settings.tripStop = v, 'When on, Pip says goodnight after the last stop and the worlds rest until tomorrow. A grown-up can still open them here.');
      toggle('Big Kid worlds for little explorers', DB.settings.allWorlds, v => DB.settings.allWorlds = v, 'Lets Ages 2–5 explorers also visit the Grade 1–5 worlds.');
    }
    if (tab === 'settings'){
      const st = DB.settings;
      toggle('Voice', st.voice, v => st.voice = v, HAS_TTS ? 'Pip reads every instruction aloud. Keep it on for pre-readers.' : 'This browser has no built-in voice, so instructions show as captions only.');
      toggle('Sound effects', st.sound, v => st.sound = v);
      toggle('Music in menus', st.music, v => st.music = v);
      if (navigator.vibrate) toggle('Vibration', st.haptics, v => st.haptics = v);
      toggle('Calm mode (less motion)', st.calm, v => st.calm = v, 'Stops wobble, bobbing, confetti and page animations. Also follows the device "reduce motion" setting.');
      toggle('Bigger text', st.big, v => st.big = v);
      const r = h('div','sw2'); r.appendChild(h('span', null, 'App'));
      const seg = h('div','seg');
      if (document.fullscreenEnabled){ const b = h('button','opt', document.fullscreenElement ? 'Exit full screen' : 'Full screen'); b.onclick = () => { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(() => {}).finally(() => setTimeout(render, 300)); }; seg.appendChild(b); }
      if (installPrompt){ const b = h('button','opt', 'Install app'); b.onclick = async () => { installPrompt.prompt(); try { await installPrompt.userChoice; } catch(e){} installPrompt = null; render(); }; seg.appendChild(b); }
      r.appendChild(seg); sh.appendChild(r);
      sh.appendChild(h('p','hint', 'To install on iPad or iPhone: open this page in Safari, tap Share, then "Add to Home Screen". It then opens full screen and works offline.'));
      if (!storageOK) sh.appendChild(h('p','idea', 'This browser is blocking storage, so progress will not be saved between visits.'));
    }
    if (tab === 'players'){
      const list = h('div','plist');
      DB.profiles.forEach(p => {
        const row = h('div','prow'); row.appendChild(avatarSvg(p));
        const nm = h('div','nm'); nm.append(h('b', null, displayName(p)), h('span', null, `${levelName(p.level)} · ${p.stickers.length} stickers`)); row.appendChild(nm);
        const ed = h('button', null, 'Edit'); ed.onclick = () => editProfile(p, {onDone:() => render()});
        const rs = h('button', null, 'Reset'); rs.onclick = () => confirm(`Clear ${displayName(p)}'s stickers and progress? This can't be undone.`, 'Reset', () => { p.stickers.length = 0; p.stats = {g:{}, d:{}}; p.trip = null; flush(); render(); });
        const del = h('button', null, 'Delete'); del.onclick = () => confirm(`Delete ${displayName(p)}? Their stickers and progress will be removed from this device.`, 'Delete', () => {
          DB.profiles = DB.profiles.filter(x => x !== p); if (DB.active === p.id){ DB.active = null; S.profile = null; if (DB.profiles[0]) useProfile(DB.profiles[0]); } if (who === p) who = DB.profiles[0] || null; flush(); render(); });
        row.append(ed, rs, del); list.appendChild(row);
      });
      sh.appendChild(list);
      const add = h('button','opt done','+ Add explorer'); add.onclick = () => editProfile(null, {onDone:() => render()}); sh.appendChild(add);
      sh.appendChild(h('p','hint', 'Each explorer has their own level, stickers, trip and progress report.'));
    }
    if (tab === 'about'){
      const n = sub => Object.values(GAMES).filter(G => G.subject === sub).length;
      sh.appendChild(h('h3', null, 'A calm learning galaxy'));
      sh.appendChild(h('p', null, `Doodle Rocket has ${Object.keys(GAMES).length} games across ${PAGES.length} worlds, from Ages 2–3 through Grade 5: Math (${n('math')}), Reading & Writing (${n('reading')}), Science (${n('science')}), Social Studies (${n('social')}), Art & Music (${n('arts')}) and Feelings & Life Skills (${n('life')}).`));
      sh.appendChild(h('p', null, 'Grade games follow Common Core (math and ELA), NGSS (science) and the C3 Framework (social studies). Preschool games follow the Head Start Early Learning Outcomes Framework.'));
      sh.appendChild(h('h3', null, 'Privacy'));
      sh.appendChild(h('p', null, 'No ads, no tracking, no accounts, no purchases, and no internet needed. Progress stays on this device. Nothing ever fails: wrong taps get a gentle hint.'));
      sh.appendChild(h('p','hint', 'Doodle Rocket 1.0 · Fonts: Andika and Gaegu (SIL Open Font License).'));
    }
  };
  render(); ov.appendChild(sh); modal.appendChild(ov);
  ov.addEventListener('pointerdown', e => { if (e.target === ov) close(); });
}
function applySettings(){
  const st = DB.settings;
  S.sound = st.sound && !MUTED; S.voice = st.voice && !MUTED; S.music = st.music && !MUTED; S.haptics = st.haptics && !MUTED;
  S.calm = !!st.calm; S.big = !!st.big;
  document.body.classList.toggle('calm', S.calm); document.body.classList.toggle('big', S.big);
  music.refresh();
}

/* =========================================================
   Boot & resize
   ========================================================= */
function layout(){
  VW = innerWidth; VH = innerHeight;
  const cs = getComputedStyle($('safe'));
  SAFE.t = parseFloat(cs.paddingTop) || 0; SAFE.r = parseFloat(cs.paddingRight) || 0; SAFE.b = parseFloat(cs.paddingBottom) || 0; SAFE.l = parseFloat(cs.paddingLeft) || 0;
  UIS = QS.has('noscale') ? 1 : clamp(Math.min(VW/1180, VH/820), 1, 1.8);
  const lvw = VW/UIS, lvh = VH/UIS, avail = lvw - (SAFE.l + SAFE.r)/UIS;
  W = Math.round(Math.min(avail, lvh*2.1)); OX = Math.round((SAFE.l/UIS + (avail - W)/2) * UIS);
  H = Math.round(lvh - SAFE.b/UIS); TOP = 138 + SAFE.t/UIS;
  stage.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  frame.setAttribute('transform', `translate(${OX},0) scale(${UIS})`);
  const rs = document.documentElement.style;
  rs.setProperty('--ox', OX + 'px'); rs.setProperty('--fw', W + 'px'); rs.setProperty('--fh', lvh + 'px'); rs.setProperty('--uis', UIS);
  drawSky();
}
function rerender(){
  const sc = S.screen;
  if (sc==='start') startScreen(); else if (sc==='profiles') profilesScreen(); else if (sc==='map') mapScreen(); else if (sc==='hub') hub();
  else if (sc==='trip') tripScreen(); else if (sc==='book') bookScreen(); else if (sc==='game') startGame(S.gameKey, true);
}
let rt = null;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (innerWidth === VW && innerHeight === VH) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    layout();
    if (!$('panel') && !$('editor')) rerender();
  }, 250);
});
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol) && !QS.has('nosw'))
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
load();
applySettings();
{ const act = DB.profiles.find(p => p.id === DB.active); if (act) useProfile(act); }
(async () => {
  // Wait (briefly) for the self-hosted fonts so the title letters are measured with the real glyphs.
  try { if (document.fonts && document.fonts.load) await Promise.race([Promise.all([document.fonts.load('700 40px Gaegu'), document.fonts.load('700 20px Andika')]), new Promise(r => setTimeout(r, 1200))]); } catch(e){}
  layout();
  startScreen();
  window.DoodleRocket = {startGame, hub, startScreen, mapScreen, tripScreen, bookScreen, profilesScreen, openPanel, editProfile, celebrate,
    S, GAMES, PAGES, LEVELS, setLevel, ensureProfile, useProfile, flush, get DB(){ return DB; }, get CONTENT(){ return typeof CONTENT === 'undefined' ? null : CONTENT; }};
})();
})();
</script>
