/* ---- shared letter-building core (Letter rockets + Name tag) ---- */
function spellCore(alive, {word, art, spoken, ghosts, distractor, intro, outro}){
  return new Promise(async resolve => {
    world.innerHTML='';
    const L = word.length, wide = W > H*1.3;
    const slotW = clamp(Math.min(W/(L + (wide?3.2:1.4)), H*.13), 36, 100), slotH = slotW*1.18, gap = slotW*.18;
    const ps = clamp(Math.min(W,H)*.27, 90, 160);
    let picX, picY, rowX, rowY;
    if (wide){ picX = W*.2; picY = TOP + Math.max(slotH, ps)/2 + 6; rowX = W*.58; rowY = picY; }
    else { picX = W/2; picY = TOP + ps*.5 + 4; rowX = W/2; rowY = picY + ps*.62 + slotH/2 + 10; }
    const pic = thing(world, picX, picY); pic.inner.classList.add('bob');
    const pf = art(pic.core, ps*.5);
    const rowW = L*slotW + (L-1)*gap, slots = [];
    for (let i=0;i<L;i++){
      const x = rowX - rowW/2 + slotW/2 + i*(slotW+gap), g = at(world, x, rowY);
      sketch(g, rrD(slotW, slotH, slotW*.18), {fill:'rgba(255,255,255,.06)', hatch:false, stroke:C.paper, sw:3.5, dash:'3 10'});
      if (ghosts) txt(g, word[i], slotH*.6, {fill:C.paper, opacity:.3});
      slots.push({x, y:rowY});
    }
    const hl = thing(world, slots[0].x, rowY); hl.inner.classList.add('pulse');
    sketch(hl.core, rrD(slotW+14, slotH+14, slotW*.24), {stroke:C.sun, sw:4, dash:'8 8', double:false});
    let letters = word.split('');
    if (distractor){ const pool = 'BDEKLPTWZ'.split('').filter(ch => !word.includes(ch)); if (pool.length) letters.push(pick(pool)); }
    letters = shuffle(letters);
    const ar = clamp(Math.min(Math.min(W,H)*.105, (W-40)/(letters.length*1.25)), 30, 58);
    const ay0 = rowY + slotH/2 + ar + 22, ay1 = H - ar - 20;
    const pts = scatter(letters.length, ar+16, W-ar-16, ay0, Math.max(ay0, ay1), ar*2.3);
    const cols = [C.lilac, C.mint, C.gum, C.sky, C.orange];
    const rocks = letters.map((ch, i) => {
      const a = thing(world, pts[i][0], pts[i][1]); a.letter = ch;
      a.inner.classList.add('bob'); a.inner.style.animationDelay = `${-rnd(0,2.5)}s`;
      sketch(a.core, blob(ar,.13,9), {fill:cols[i % cols.length], sw:4});
      el('ellipse', {cx:f(ar*.55), cy:f(-ar*.5), rx:f(ar*.14), ry:f(ar*.1), fill:'rgba(0,0,0,.15)'}, a.core);
      el('ellipse', {cx:f(-ar*.58), cy:f(ar*.45), rx:f(ar*.1), ry:f(ar*.08), fill:'rgba(0,0,0,.15)'}, a.core);
      txt(a.core, ch, ar*1.05);
      appear(a, i*50);
      return a;
    });
    let idx = 0;
    const tryPlace = async a => {
      if (a.placed || !alive() || idx >= L) return;
      const want = word[idx];
      if (a.letter !== want){
        wiggle(a); miss(); flyTo(a, a.hx, a.hy, 1, 350);
        caption(`Find ${want}`);
        await say(`That's ${LETTER[a.letter]}. Find ${LETTER[want]}!`);
        return;
      }
      a.placed = true; a.locked = true; const i = idx; idx++;
      a.inner.classList.remove('bob');
      if (idx < L){ hl.x = slots[idx].x; hl.place(); } else hl.g.remove();
      await flyTo(a, slots[i].x, slots[i].y, (slotW*.92)/(ar*2), 380);
      if (!alive()) return;
      sfx.place(); await say(LETTER[a.letter], {rate:.9});
      if (!alive()) return;
      if (idx < L){ caption(`Find ${word[idx]}`); say(`Find ${LETTER[word[idx]]}`, {interrupt:false}); return; }
      await wait(250);
      const placed = rocks.filter(r => r.placed).sort((p,q) => p.x - q.x);
      for (const r of placed){ if (!alive()) return; pop(r, .25); await say(LETTER[r.letter], {rate:1.1}); }
      if (!alive()) return;
      caption(`${word}!`); sfx.win(); pf.set('happy'); pop(pic, .3); burst(pic.x, pic.y, 7);
      await say(outro || `${spoken}!`);
      if (alive()) resolve();
    };
    rocks.forEach(a => interact(a, {label:`letter ${a.letter}`, drag:true, onTap:() => tryPlace(a), onDrop:() => {
      const s = slots[idx];
      if (s && Math.hypot(a.x-s.x, a.y-s.y) < slotW) tryPlace(a); else flyTo(a, a.hx, a.hy, 1, 350);
    }}));
    if (intro) await prompt(`Spell ${word}`, intro);
    if (!alive()) return;
    await prompt(`Spell ${word}`, `Let's spell ${spoken}! Find ${LETTER[word[0]]}.`);
  });
}
function playSpell(alive){
  const w = S.data.words[S.round % S.data.words.length], little = S.age==='little';
  return spellCore(alive, {word:w, art:ART[w], spoken:w.toLowerCase(), ghosts:little, distractor:!little});
}
function playName(alive){
  const nm = (S.name || 'PIP').slice(0, 8), little = S.age==='little';
  const spoken = nm[0] + nm.slice(1).toLowerCase();

    ghosts: little || S.round < 2, distractor: !little && S.round > 0,
    intro: (!S.name && S.round===0) ? "Let's spell Pip's name. Grown-ups can add your name in the settings." : null,
    outro: S.name ? `${spoken}! That's your name!` : `${spoken}! That's Pip's name!`});

/* ---- Trace to launch ---- */
const TRACE = {
  I:['M50 12 L50 88'],
  L:['M32 12 L32 88 L72 88'],
  T:['M22 14 L78 14','M50 14 L50 88'],
  O:['M50 12 C28 12 18 32 18 50 C18 70 30 88 50 88 C70 88 82 70 82 50 C82 30 72 12 50 12'],
  C:['M76 26 C68 16 58 12 50 12 C30 12 18 32 18 50 C18 70 30 88 50 88 C60 88 70 82 76 72'],
  S:['M72 24 C66 14 58 12 48 12 C34 12 26 22 26 32 C26 46 42 48 50 50 C60 52 74 56 74 70 C74 82 62 88 50 88 C38 88 30 82 26 74'],
  A:['M50 12 L22 88','M50 12 L78 88','M33 60 L67 60'],
  M:['M20 88 L20 12 L50 58 L80 12 L80 88'],
  N:['M24 88 L24 12 L76 88 L76 12'],
  P:['M30 88 L30 12','M30 12 L56 12 C70 12 76 22 76 32 C76 42 70 52 56 52 L30 52'],
};
function playTrace(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const ch = S.data.trace[S.round % S.data.trace.length];
    const B = clamp(Math.min(W*.82, H-TOP-40), 180, 440);
    const ox = W/2 - B/2, oy = TOP + Math.max(0, (H-TOP-20-B)/2), sc = B/100;
    const tmp = el('path', {}, world);
    const sampled = TRACE[ch].map(d => {
      tmp.setAttribute('d', d); const len = tmp.getTotalLength(), n = Math.max(8, Math.ceil(len/2.5)), pts = [];
      for (let i=0;i<=n;i++){ const p = tmp.getPointAtLength(len*i/n); pts.push([ox+p.x*sc, oy+p.y*sc]); }
      return pts;
    });
    tmp.remove();
    const poly = pts => 'M' + pts.map(p => f(p[0])+','+f(p[1])).join(' L');
    sampled.forEach(pts => {
      el('path', {d:poly(pts), stroke:'rgba(255,253,246,.16)', 'stroke-width':f(sc*15), fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'}, world);
      el('path', {d:poly(pts), stroke:C.paper, 'stroke-width':3, 'stroke-dasharray':'2 10', fill:'none', 'stroke-linecap':'round', opacity:.8}, world);
    });
    const fuel = el('g', {}, world);
    const marker = thing(world, 0, 0); marker.inner.classList.add('pulse');
    sketch(marker.core, starD(clamp(sc*6.5, 14, 26)), {fill:C.mint, sw:3});
    const hit = el('rect', {x:0, y:0, width:W, height:H, fill:'transparent'}, world);
    let si = 0, idx = 0, cur = null, drawing = false, done = false, lastS = 0;
    const setStroke = () => { const p = sampled[si][0]; marker.x = p[0]; marker.y = p[1]; marker.place(); idx = 0;
      cur = el('path', {stroke:C.sun, 'stroke-width':f(sc*9), fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round'}, fuel); };
    setStroke();
    const tol = Math.max(22, sc*11);
    const finishStroke = async () => {
      drawing = false; cur.setAttribute('d', poly(sampled[si])); sfx.place(); si++;
      if (si < sampled.length){ setStroke(); say(pick(['Great! Now this one.','Keep going!','Now the next line!'])); return; }
      done = true; marker.g.remove(); hit.remove();
      fuel.querySelectorAll('path').forEach(p => p.setAttribute('stroke', C.tomato));
      const rs = clamp(sc*14, 40, 70), rk = thing(world, W/2, oy + B*.5); drawRocket(rk.core, rs); appear(rk);
      caption(`${ch}!`); sfx.whoosh();
      say(`${LETTER[ch]}! You traced ${LETTER[ch]}. Blast off!`);
      await wait(600);
      const sy = rk.y; await tween(1300, t => { rk.y = sy - t*(sy + 200); rk.place(); }, t => t*t);
      if (alive()) resolve();
    };
    const advance = (x, y) => {
      if (done) return;
      const pts = sampled[si]; let moved = false;
      for (let j=idx; j<Math.min(pts.length, idx+10); j++) if (Math.hypot(pts[j][0]-x, pts[j][1]-y) < tol){ idx = j+1; moved = true; }
      if (!moved) return;
      marker.inner.classList.remove('pulse');
      cur.setAttribute('d', poly(pts.slice(0, Math.max(2, idx))));
      const p = pts[Math.min(idx, pts.length-1)]; marker.x = p[0]; marker.y = p[1]; marker.place();
      const now = performance.now(); if (now - lastS > 90){ lastS = now; sfx.scratch(); }
      if (idx >= pts.length-1) finishStroke();
    };
    hit.addEventListener('pointerdown', e => { if (done) return; e.preventDefault(); unlockAudio(); drawing = true; advance(px(e), py(e)); });
    listen(window, 'pointermove', e => { if (drawing) advance(px(e), py(e)); });
    listen(window, 'pointerup', () => { drawing = false; });
    prompt(`Trace ${ch}`, `Trace the letter ${LETTER[ch]} to fill the rocket with fuel! Start at the green star.`);
  });
}

/* ---- Day & night spinner ---- */
function playDay(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const target = ['day','night','day'][S.round % 3];
    const land = W > H*1.05;
    const er = clamp(Math.min(land ? W*.22 : W*.34, (H-TOP)*(land ? .34 : .26)), 65, 190);
    const ex = land ? W*.6 : W/2, ey = land ? (TOP+H)/2 + 10 : H - er*1.35 - 20;
    const sunR = clamp(er*.5, 38, 85);
    const sx = land ? Math.max(sunR+24, W*.16) : W/2, sy = land ? ey : TOP + sunR + 6;
    const sd = Math.atan2(sy-ey, sx-ex)*180/Math.PI;
    const sun = thing(world, sx, sy); sun.inner.classList.add('bob'); ART.SUN(sun.core, sunR);
    const earth = thing(world, ex, ey);
    el('circle', {r:f(er*1.35), fill:'transparent'}, earth.core);
    sketch(earth.core, blob(er,.03,16), {fill:C.sky, sw:5});
    [[-.35,-.2,.35],[.4,.3,.3],[.1,.55,.22],[-.45,.5,.18]].forEach(([x,y,k]) => sketch(at(earth.core, x*er, y*er), blob(er*k,.18,9), {fill:C.mint, sw:3}));
    const hs = er*.32, house = at(earth.core, 0, -er*.98);
    sketch(at(house, hs*.78, -hs*.12), rrD(hs*.12, hs*.3, 2), {fill:'#9A6440', sw:2.5, hatch:false});
    sketch(at(house, hs*.78, -hs*.4), blob(hs*.26,.1,8), {fill:'#3FB98F', sw:3});
    sketch(at(house, 0, -hs*.35), rrD(hs*.8, hs*.7, hs*.08), {fill:C.paper});
    sketch(at(house, 0, -hs*.85), triD(hs*1.05, hs*.45), {fill:C.tomato});
    const win = el('rect', {x:f(-hs*.18), y:f(-hs*.52), width:f(hs*.36), height:f(hs*.28), fill:C.sky, stroke:C.ink, 'stroke-width':2.5}, house);
    const shade = el('g', {transform:`translate(${f(ex)},${f(ey)}) rotate(${f(sd-180)})`, 'pointer-events':'none'}, world);
    el('path', {d:`M0,${f(-er*1.42)} A${f(er*1.42)} ${f(er*1.42)} 0 0 1 0,${f(er*1.42)}Z`, fill:'rgba(6,8,30,.5)'}, shade);
    const houseAng = () => earth.r - 90;
    const look = () => win.setAttribute('fill', angDiff(houseAng(), sd) > 90 ? C.sun : C.sky);
    earth.r = target==='day' ? sd + 270 : sd + 90; earth.place(); look();
    let solved = false;
    const check = async () => {
      if (solved || !alive()) return;
      const d = angDiff(houseAng(), sd), ok = target==='day' ? d < 50 : d > 130;
      if (!ok) return;
      solved = true; sfx.win(); caption(target==='day' ? 'Good morning!' : 'Good night!');
      await say(target==='day' ? 'Good morning! The house faces the Sun, so it is daytime.' : 'Good night! The house faces away from the Sun, so it is night time.');
      if (alive()) resolve();
    };
    const spinBy = async deg => { const r0 = earth.r; sfx.whoosh(); await tween(500, t => { earth.r = r0 + deg*t; earth.place(); look(); }); check(); };
    earth.g.style.cursor = 'grab'; earth.g.setAttribute('role','button'); earth.g.setAttribute('tabindex','0'); earth.g.setAttribute('aria-label','Spin the Earth');
    earth.g.addEventListener('keydown', e => { if ((e.key==='Enter'||e.key===' ') && !solved){ e.preventDefault(); spinBy(60); } });
    earth.g.addEventListener('pointerdown', e => {
      if (solved) return; e.preventDefault(); unlockAudio();
      let last = Math.atan2(py(e)-ey, px(e)-ex)*180/Math.PI, acc = 0, moved = false;
      const mv = ev => { const a = Math.atan2(py(ev)-ey, px(ev)-ex)*180/Math.PI; let d = a - last; if (d>180) d-=360; if (d<-180) d+=360; last = a; acc += d; if (Math.abs(acc) > 4) moved = true; earth.r += d; earth.place(); look(); };
      const up = () => { removeEventListener('pointermove', mv); removeEventListener('pointerup', up); removeEventListener('pointercancel', up); if (!moved) spinBy(60); else check(); };
      addEventListener('pointermove', mv); addEventListener('pointerup', up); addEventListener('pointercancel', up);
    });
    earth.inner.classList.add('pulse'); setTimeout(() => earth.inner.classList.remove('pulse'), 2500);
    if (target==='day') prompt('Make it daytime!', "It's night at the house! Spin the Earth so the house faces the Sun.");
    else prompt('Make it night time!', 'Now spin the Earth to make it night time at the house.');
  });
}

    if (land){ const cols = items.length > 2 ? 2 : 1, rows = Math.ceil(items.length/cols), gs = Math.min(cs, (H-TOP-40)/rows - 14); pos = items.map((_,i) => [W*.7 + (cols>1 ? (i%2 ? 1 : -1)*(gs*.6+6) : 0), TOP + 20 + (gs+14)*(Math.floor(i/cols)+.5)]); }
    else { const { xs, size } = rowXs(items.length, cs, 14); pos = items.map((_,i) => [xs[i], H - size/2 - 24]); }
    const size = land ? Math.min(cs, (H-TOP-40)/Math.ceil(items.length/(items.length>2?2:1)) - 14) : rowXs(items.length, cs, 14).size;
    const cards = items.map((key,i) => { const t = thing(world, pos[i][0], pos[i][1]); cardBg(t, size); gearIcon(at(t.core,0,0), key, size*.32); t.key = key; t.label = GEAR_NAME[key]; appear(t, i*80); return t; });
    let next = 0, misses = 0;
    prompt('What goes on first?', `Help Pip get ready for space! What goes on first?`);
    cards.forEach(c => interact(c, {label:c.label, onTap: async () => {
      if (!alive() || c.used) return;
      if (c.key !== seq[next]){
        misses++; wiggle(c); miss();
        if (little || misses >= 2) cards.forEach(q => q.inner.classList.toggle('pulse', q.key === seq[next]));
        say(`Not yet! First, the ${GEAR_NAME[seq[next]]}.`);
        return;
      }
      misses = 0; cards.forEach(q => q.inner.classList.remove('pulse'));
      c.used = true; c.locked = true; next++;
      await flyTo(c, pip.x, pip.y, .2, 400, easeInOut); c.g.remove();
      if (!alive()) return;
      L[c.key].setAttribute('opacity', 1); pop(pip, .08); sfx.place();
      await say(`${cap1(GEAR_NAME[c.key])} on!`, {rate:1});
      if (!alive()) return;
      if (next < seq.length){ caption('What goes on next?'); return; }
      sfx.win(); caption('Ready for space!');
      await say(`Ready for space! ${seq.map(k => GEAR_NAME[k]).join(', then ')}.`);
      if (alive()) resolve();
    }}));
  });
}

/* ---- Build a rocket (shapes → parts) ---- */
function playBuild(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const little = S.age==='little';
    const pool = little ? ['rectangle','triangle','circle'] : ['rectangle','triangle','circle','oval','square'];
    const cardS = clamp(Math.min(W/(pool.length+.8), H*.16), 64, 120), cardY = H - cardS/2 - 22;
    const R = clamp(Math.min(W*.3, (cardY - cardS/2 - TOP - 30)*.42), 60, 160);
    const rx = W/2, ry = TOP + (cardY - cardS/2 - TOP)/2 + R*.05;
    const P = {
      body:{shape:'rectangle', x:0, y:0, w:.62, h:1.1, c:C.paper, name:'body'},
      nose:{shape:'triangle', x:0, y:-.8, w:.62, h:.5, c:C.tomato, name:'nose'},
      window:{shape:'circle', x:0, y:-.2, w:.3, h:.3, c:C.sky, name:'window'},
      finL:{shape:'triangle', x:-.47, y:.42, w:.32, h:.4, c:C.tomato, name:'fin'},
      finR:{shape:'triangle', x:.47, y:.42, w:.32, h:.4, c:C.tomato, name:'fin'},
      flame:{shape:'oval', x:0, y:.8, w:.3, h:.42, c:C.sun, name:'flame'},
    };
    const steps = S.round===0 ? ['body','nose','window'] : (S.round===2 && !little ? ['body','nose','window','finL','finR','flame'] : ['body','nose','window','finL','finR']);
    const rocket = thing(world, rx, ry);
    const ghosts = {}, pieces = el('g', {}, rocket.core);
    steps.forEach(k => { const p = P[k]; ghosts[k] = sketch(at(rocket.core, p.x*R, p.y*R), SHAPE[p.shape](p.w*R, p.h*R), {stroke:C.paper, sw:3, dash:'3 9'}); });
    const hl = el('g', {class:'pulse', style:'transform-box:fill-box;transform-origin:center'}, rocket.core);
    const { size, xs } = rowXs(pool.length, cardS, 14);
    const cards = shuffle(pool).map((s,i) => { const c = shapeCard(world, xs[i], cardY, size, s, C.sun); appear(c, i*70); return c; });
    let step = 0, misses = 0;
    const showStep = () => {
      hl.innerHTML=''; const p = P[steps[step]];
      sketch(at(hl, p.x*R, p.y*R), SHAPE[p.shape]((p.w*R)+10, (p.h*R)+10), {stroke:C.sun, sw:4, dash:'6 7', double:false});
      caption(`Find the ${p.shape}!`);
      return say(`The ${p.name} is ${art_(p.shape)} ${p.shape}. Find the ${p.shape}!`);
    };
    await prompt("Let's build a rocket!", "Let's build a rocket out of shapes!");
    if (!alive()) return;
    showStep();
    cards.forEach(c => interact(c, {label:c.label, onTap: async () => {
      if (!alive() || step >= steps.length) return;
      const p = P[steps[step]];
      if (c.key !== p.shape){
        misses++; wiggle(c); miss();
        if (misses >= 2) cards.forEach(q => q.inner.classList.toggle('pulse', q.key === p.shape));
        say(`That's ${art_(c.key)} ${c.key}. We need ${art_(p.shape)} ${p.shape}.`);
        return;
      }
      misses = 0; cards.forEach(q => q.inner.classList.remove('pulse'));
      const k = steps[step]; step++;
      const fly = thing(world, c.x, c.y); sketch(fly.core, SHAPE[p.shape](p.w*R, p.h*R), {fill:p.c});
      fly.s = (size*.5)/(Math.max(p.w,p.h)*R); fly.place(); sfx.place();
      await flyTo(fly, rx + p.x*R, ry + p.y*R, 1, 420, easeInOut);
      if (!alive()) return;
      fly.g.remove(); ghosts[k].remove();
      sketch(at(pieces, p.x*R, p.y*R), SHAPE[p.shape](p.w*R, p.h*R), {fill:p.c});
      if (k==='window') face(at(pieces, 0, -.2*R), .14*R);
      if (step < steps.length){ await say(`${cap1(p.name)}!`, {rate:1}); if (alive()) showStep(); return; }
      hl.remove(); cards.forEach(q => q.locked = true);
      caption('3, 2, 1, blast off!'); await say('Three, two, one, blast off!'); if (!alive()) return;
      sfx.whoosh();
      const sy = rocket.y; await tween(1400, t => { rocket.y = sy - t*(sy + R*2); rocket.place(); }, t => t*t);
      if (alive()) resolve();
    }}));
  });
}

/* ---- Doodle pad (creative) ---- */
const CRAYONS = [C.tomato, C.sun, C.mint, C.sky, C.gum, C.paper];
function playDoodle(alive){
  return new Promise(resolve => {
    world.innerHTML='';
    const strokes = [];
    let color = C.sun, cur = null, drawing = false;
    const hit = el('rect', {width:W, height:H, fill:'transparent'}, world);
    const layer = el('g', {'pointer-events':'none', 'data-boil':''}, world); if (!lowPower) layer.setAttribute('filter', 'url(#wb)');
    const bottomUI = 150;
    const redraw = s => s.el.setAttribute('d', 'M' + s.pts.map(p => f(p[0])+','+f(p[1])).join(' L'));
    hit.addEventListener('pointerdown', e => {
      if (py(e) > H - bottomUI || py(e) < 90) return;
      e.preventDefault(); unlockAudio(); drawing = true;
      cur = {c:color, pts:[[px(e), py(e)], [px(e)+.5, py(e)+.5]]};
      cur.el = line(layer, '', color, 11); redraw(cur); strokes.push(cur);
    });
    listen(window, 'pointermove', e => {
      if (!drawing || !cur) return;
      const lp = cur.pts[cur.pts.length-1];
      if (Math.hypot(px(e)-lp[0], py(e)-lp[1]) < 3) return;
      cur.pts.push([px(e), Math.min(py(e), H-bottomUI)]); redraw(cur);
    });
    listen(window, 'pointerup', () => { drawing = false; cur = null; });
    const pal = h('div'); pal.id = 'palette';
    const tools = h('div', 'row'), swr = h('div', 'row');
    const clear = h('button', 'paper tool', 'Clear'); clear.onclick = () => { strokes.forEach(s => s.el.remove()); strokes.length = 0; sfx.page(); };
    const done = h('button', 'paper tool go', 'Make a sticker');
    done.onclick = () => {
      unlockAudio();
      if (!strokes.length){ say('Draw something first!'); caption('Draw something first!'); return; }
      S.data.sticker = {type:'doodle', strokes:strokes.map(s => ({c:s.c, pts:s.pts}))};
      pal.remove(); resolve();
    };
    tools.append(clear, done);
    CRAYONS.forEach((c,i) => {
      const b = h('button', 'sw'); b.style.background = c; b.setAttribute('aria-label', ['red','yellow','green','blue','pink','white'][i] + ' crayon');
      b.setAttribute('aria-pressed', String(c===color));
      b.onclick = () => { color = c; swr.querySelectorAll('.sw').forEach(x => x.setAttribute('aria-pressed', String(x===b))); sfx.pop(i+1); };
      swr.appendChild(b);
    });
    pal.append(tools, swr); ui.appendChild(pal);
    prompt('Draw anything!', 'Draw anything you like! Tap a crayon to pick a color. When you are done, make it a sticker!');
  });
}

function cardRow(items, draw, {size, gap=16, y=null} = {}){

/* ---- Color mixer (color names; mixing primaries) ---- */
const PAINT = {red:C.tomato, yellow:C.sun, blue:'#4F8DF5', green:'#4CC46A', orange:C.orange, purple:'#9B6BE0'};
const MIXES = {orange:['red','yellow'], green:['blue','yellow'], purple:['red','blue']};
const mixOf = (a, b) => a === b ? a : (Object.keys(MIXES).find(k => MIXES[k].includes(a) && MIXES[k].includes(b)) || a);
function playColorMix(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const little = S.age==='little';
    const target = S.data.colors[S.round % S.data.colors.length];
    const pots = little ? shuffle([target, ...shuffle(['red','yellow','blue','green'].filter(c => c!==target)).slice(0, S.round ? 2 : 1)]) : ['red','yellow','blue'];
    const land = W > H*1.05;
    const cs = clamp(Math.min(W/(pots.length+.9), (H-TOP)*.2), 84, 150), cardY = H - cs/2 - 24;
    const top = TOP + 6, bot = cardY - cs/2 - 14;
    const pr = clamp(Math.min(land ? W*.14 : W*.26, (bot-top)*(little ? .38 : .27)), 50, 130);
    const px0 = little || !land ? W/2 : W*.34, py0 = little || !land ? top + (bot-top)*(little ? .5 : .3) : (top+bot)/2;
    const pl = thing(world, px0, py0); pl.inner.classList.add('bob');
    el('circle', {r:f(pr*1.1), fill:'transparent'}, pl.core);
    const blank = sketch(pl.core, blob(pr,.03,14), {fill:'rgba(255,253,246,.1)', stroke:C.paper, sw:4, dash:'4 9', hatch:false});
    const paintG = el('g', {}, pl.core), faceG = el('g', {}, pl.core);
    face(faceG, pr*.8, {mood:'o'});
    const paintPlanet = async color => {
      blank.remove(); drawPlanet(paintG, pr, PAINT[color], {craters:true}); paintG.setAttribute('transform','scale(.2)');
      await tween(420, t => paintG.setAttribute('transform', `scale(${f(.2 + .8*t)})`), easeOutBack);
      faceG.innerHTML=''; face(faceG, pr*.8); sparkle(pl.x, pl.y, 10, pr*1.3); sfx.win();
    };
    const cards = cardRow(pots, (t, c, sz) => {
      sketch(at(t.core, 0, sz*.02), rrD(sz*.46, sz*.42, sz*.07), {fill:C.paper, sw:3.5, hatch:false});
      sketch(at(t.core, 0, -sz*.19), ovalD(sz*.25, sz*.08), {fill:PAINT[c], sw:3, hatch:false});
      sketch(at(t.core, 0, sz*.05), blob(sz*.12,.1,9), {fill:PAINT[c], sw:2.5});
      cardWord(t, c, sz); t.color = c; t.label = `${c} paint`;
    }, {size:cs});
    const flyPaint = async (from, x, y) => {
      const b = thing(world, from.x, from.y - from.sz*.2); sketch(b.core, blob(cs*.12,.15,9), {fill:PAINT[from.color], sw:2.5, hatch:false});
      sfx.pour(); await flyTo(b, x, y, 1.3, 480, easeInOut); b.g.remove();
    };
    let busy = false, misses = 0, done = false;
    if (little){
      S.q = {answer:`${target} paint`};
      prompt(`Paint it ${target}!`, `Let's paint the planet ${target}! Find the ${target} paint.`);
      cards.forEach(c => interact(c, {label:c.label, onTap: async () => {
        if (busy || done || !alive()) return;
        if (c.color !== target){ misses++; wiggle(c); miss(); caption(`Find ${target}!`); if (misses >= 2) cards.forEach(q => q.inner.classList.toggle('pulse', q.color===target)); await say(`That's ${c.color}. Find ${target}!`); return; }
        busy = true; done = true; cards.forEach(q => { q.locked = true; q.inner.classList.remove('pulse'); });
        await flyPaint(c, pl.x, pl.y); if (!alive()) return;
        await paintPlanet(target); if (!alive()) return;
        caption(`${cap1(target)}!`); await say(`${cap1(target)}! What a beautiful ${target} planet!`);
        if (alive()) resolve();
      }}));
      return;
    }
    // Captains mix two primaries in a bowl to make the secondary color.
    const bx = land ? W*.68 : W/2, by = land ? (top+bot)/2 + pr*.2 : top + (bot-top)*.74, bw = clamp(Math.min(W*.3, (bot-top)*.5), 90, 190);
    const bowl = at(world, bx, by);
    const fillP = el('path', {d:`M${f(-bw*.46)},${f(-bw*.06)} Q0,${f(bw*.02)} ${f(bw*.46)},${f(-bw*.06)} Q${f(bw*.42)},${f(bw*.32)} 0,${f(bw*.34)} Q${f(-bw*.42)},${f(bw*.32)} ${f(-bw*.46)},${f(-bw*.06)}Z`, fill:'none'}, bowl);
    sketch(bowl, `M${f(-bw/2)},${f(-bw*.12)} Q${f(-bw*.48)},${f(bw*.42)} 0,${f(bw*.42)} Q${f(bw*.48)},${f(bw*.42)} ${f(bw/2)},${f(-bw*.12)}Z`, {fill:'rgba(255,253,246,.16)', stroke:C.paper, sw:5, hatch:false});
    sketch(at(bowl, 0, -bw*.12), ovalD(bw*.5, bw*.06), {stroke:C.paper, sw:3, hatch:false});
    const swirl = el('path', {d:`M0,${f(bw*.08)} m-${f(bw*.05)},0 a${f(bw*.05)} ${f(bw*.05)} 0 1 1 ${f(bw*.1)},0 a${f(bw*.1)} ${f(bw*.1)} 0 1 1 ${f(-bw*.2)},0 a${f(bw*.15)} ${f(bw*.15)} 0 1 1 ${f(bw*.3)},0`, fill:'none', stroke:'rgba(255,255,255,.6)', 'stroke-width':3, 'stroke-linecap':'round', opacity:0}, bowl);
    let inBowl = [];
    const need = () => MIXES[target].filter(c => !inBowl.includes(c));
    const hook = () => { S.q = {answer:`${need()[0]} paint`}; };
    const setBowl = c => fillP.setAttribute('fill', c ? PAINT[c] : 'none');
    hook();
    prompt(`Make ${target}!`, `Let's make ${target} paint! Pick two colors to mix.`);
    cards.forEach(c => interact(c, {label:c.label, onTap: async () => {
      if (busy || done || !alive()) return; busy = true;
      await flyPaint(c, bx, by); if (!alive()) return;
      inBowl.push(c.color); sfx.plop();
      if (inBowl.length === 1){ setBowl(c.color); say(c.color); hook(); busy = false; return; }
      const res = mixOf(inBowl[0], inBowl[1]);
      swirl.setAttribute('opacity', 1); tween(700, t => swirl.setAttribute('transform', `rotate(${f(t*540)} 0 ${f(bw*.08)})`)).then(() => swirl.setAttribute('opacity', 0));
      await tween(700, t => fillP.setAttribute('fill', t < .5 ? PAINT[inBowl[1]] : PAINT[res]));
      if (!alive()) return;
      const pair = inBowl[0] === inBowl[1] ? `Two ${inBowl[0]}s` : `${cap1(inBowl[0])} and ${inBowl[1]}`;
      if (res === target){
        done = true; cards.forEach(q => { q.locked = true; q.inner.classList.remove('pulse'); });
        caption(`${cap1(inBowl[0])} + ${inBowl[1]} = ${target}!`);
        const b = thing(world, bx, by); sketch(b.core, blob(cs*.14,.15,9), {fill:PAINT[target], sw:2.5, hatch:false}); await flyTo(b, pl.x, pl.y, 1.4, 480, easeInOut); b.g.remove(); setBowl(null);
        await paintPlanet(target); if (!alive()) return;
        await say(`${pair} make ${target}! What a beautiful ${target} planet!`);
        if (alive()) resolve(); return;
      }
      misses++; miss(); caption(`That makes ${res}!`);
      await say(`${pair} make ${res}! We need ${target}. Let's try again.`); if (!alive()) return;
      inBowl = []; setBowl(null); hook(); busy = false;
      if (misses >= 2) cards.forEach(q => q.inner.classList.toggle('pulse', MIXES[target].includes(q.color)));
    }}));
  });
}

/* ---- Echo song (listen, then play the melody back) ---- */
const NOTE_KEYS = [['star', C.sun, 'yellow star', 0], ['circle', C.tomato, 'red circle', 2], ['heart', C.gum, 'pink heart', 3], ['triangle', C.sky, 'blue triangle', 4]];
function playEcho(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const little = S.age==='little', n = little ? 3 : 4, len = little ? [2,2,3][S.round%3] : [3,4,4][S.round%3];
    const seq = []; while (seq.length < len){ const k = randInt(0, n-1); if (k !== seq[seq.length-1]) seq.push(k); }
    const land = W > H*1.05, s = clamp(Math.min(W/(n+.9), (H-TOP)*(land ? .34 : .2)), 70, 150);
    const cy = land ? TOP + (H-TOP)*.58 : TOP + (H-TOP)*.62, arc = land ? (H-TOP)*.12 : s*.35;
    const { xs } = rowXs(n, s, s*.25);
    // Pip with a music note, top left
    const P = clamp(Math.min(W*.14, (cy - arc - s*.6 - TOP)*.36), 34, 84), pip = thing(world, W/2, TOP + (cy - arc - s*.55 - TOP)/2 + P*.2); pip.inner.classList.add('bob'); drawPip(pip.core, P);
    drawNote(at(world, pip.x + P*.95, pip.y - P*.9), P*.45);
    const notes = NOTE_KEYS.slice(0, n).map(([shape, col, label, pitch], i) => {
      const t = thing(world, xs[i], cy - Math.sin(Math.PI*(n>1 ? i/(n-1) : .5))*arc); t.label = label; t.pitch = pitch;
      el('circle', {r:f(s*.55), fill:'transparent'}, t.core);
      sketch(t.core, blob(s*.5,.04,14), {fill:'rgba(255,253,246,.1)', stroke:C.paper, sw:3, dash:'3 8', hatch:false});
      drawShape(t.core, shape, s*.62, col);
      appear(t, i*90);
      return t;
    });
    let busy = true, pos = 0, misses = 0;
    const light = async t => { t.inner.classList.add('glow'); pop(t, .22); sfx.note(t.pitch); await wait(430); t.inner.classList.remove('glow'); };
    const playSeq = async () => { busy = true; for (const k of seq){ if (!alive()) return; await light(notes[k]); await wait(140); } busy = false; };
    const hint = () => notes.forEach(q => q.inner.classList.toggle('pulse', misses >= 2 && q === notes[seq[pos]]));
    const hook = () => { S.q = {answer:notes[seq[pos]].label}; };
    await prompt('Listen!', 'Listen to my song!'); if (!alive()) return;
    await playSeq(); if (!alive()) return;
    hook();
    await prompt('Your turn!', 'Your turn! Tap the same song.');
    S.repeat = async () => { if (busy) return; caption('Listen!'); await playSeq(); if (alive()) caption('Your turn!'); };
    if (!alive()) return;
    notes.forEach(t => interact(t, {label:t.label, onTap: async () => {
      if (busy || !alive() || pos >= seq.length) return;
      if (t === notes[seq[pos]]){
        light(t); pos++;
        if (pos < seq.length){ hook(); hint(); return; }
        busy = true; notes.forEach(q => q.inner.classList.remove('pulse'));
        await wait(520); if (!alive()) return;
        caption('You played my song!'); sparkle(W/2, cy, 10, s); await say('You played my song! Beautiful music!');
        if (alive()) resolve(); return;
      }
      misses++; miss(); wiggle(t); busy = true; caption('Listen again!');
      await say('Oops! Listen again.'); if (!alive()) return;
      pos = 0; await playSeq(); if (!alive()) return;
      hook(); hint(); caption('Your turn!');
    }}));
  });
}

/* ---- Pip's feelings (naming emotions, calm-down breathing) ---- */
function drawFeeling(g, r, emo){
  sketch(g, blob(r,.04,14), {fill:C.lilac, sw:4});
  const E = (x, y, rx, ry) => el('ellipse', {cx:f(x), cy:f(y), rx:f(rx), ry:f(ry), fill:C.ink}, g);
  const brow = (k, inner, outer) => line(g, `M${f(k*r*.14)},${f(inner*r)} L${f(k*r*.5)},${f(outer*r)}`, C.ink, Math.max(3, r*.07));
  const mouth = (d, fill) => el('path', {d, fill:fill || 'none', stroke:C.ink, 'stroke-width':f(Math.max(3, r*.06)), 'stroke-linecap':'round', 'stroke-linejoin':'round'}, g);
  const ex = r*.32, ey = -r*.1;
  if (emo === 'sleepy'){
    [-1,1].forEach(k => line(g, `M${f(k*ex - r*.13)},${f(ey)} Q${f(k*ex)},${f(ey + r*.1)} ${f(k*ex + r*.13)},${f(ey)}`, C.ink, Math.max(3, r*.06)));
    el('ellipse', {cx:0, cy:f(r*.38), rx:f(r*.09), ry:f(r*.12), fill:'#5A1A27'}, g);
    txt(g, 'z', r*.4, {hand:true, x:r*.72, y:-r*.72, fill:C.paper, stroke:C.ink, sw:3}); txt(g, 'z', r*.28, {hand:true, x:r*.95, y:-r*1.0, fill:C.paper, stroke:C.ink, sw:3});
    return;
  }
  const wide = emo === 'surprised' || emo === 'scared';

const MATCH_PICS = ['sun','moon','star','rocket','planet','cat','fish','bee','apple','heart','ball','duck'];
function playMemory(alive){
  return new Promise(async resolve => {
    world.innerHTML='';
    const little = S.age==='little';
    const pairsN = little ? [2,3,3][S.round%3] : [3,4,6][S.round%3];
    const mode = little ? 'pic' : ['pic','num','abc'][S.round%3];
    const faces = [];
    if (mode === 'pic') shuffle(MATCH_PICS).slice(0, pairsN).forEach((k, i) => faces.push({id:i, kind:'pic', v:k}, {id:i, kind:'pic', v:k}));
    if (mode === 'num') shuffle([1,2,3,4,5,6]).slice(0, pairsN).forEach((n, i) => faces.push({id:i, kind:'num', v:n}, {id:i, kind:'dots', v:n}));
    if (mode === 'abc') shuffle('ABDEFGHMNRT'.split('')).slice(0, pairsN).forEach((ch, i) => faces.push({id:i, kind:'up', v:ch}, {id:i, kind:'low', v:ch.toLowerCase()}));
    const deck = shuffle(faces), n = deck.length, land = W > H*1.05;
    const cols = land ? (n <= 4 ? n : n <= 6 ? 3 : 4) : (n <= 4 ? 2 : 3), rows = Math.ceil(n/cols);
    const top = TOP + 6, bot = H - 20;
    const cs = clamp(Math.min((W - 30)/cols - 14, (bot - top)/rows - 14), 70, 150);
    const gx = cs + 14, gy = cs + 14, ox = W/2 - (cols-1)*gx/2, oy = top + (bot - top)/2 - (rows-1)*gy/2;
    const drawFace = (g, fc) => {
      sketch(g, rrD(cs, cs, cs*.16), {fill:C.paper, sw:3.5, hatch:false});
      if (fc.kind === 'pic') DOODLE[fc.v](at(g, 0, 0), cs*.32);
      else if (fc.kind === 'dots') (DICE[fc.v] || [[-.5,-.5],[.5,-.5],[0,0],[-.5,.5],[.5,.5],[0,.55]].slice(0, fc.v)).forEach(([x,y]) => el('circle', {cx:f(x*cs*.3), cy:f(y*cs*.3), r:f(cs*.07), fill:C.tomato, stroke:C.ink, 'stroke-width':2.5}, g));
      else txt(g, String(fc.v), cs*.52);
    };
    const drawBack = g => { sketch(g, rrD(cs, cs, cs*.16), {fill:'#4A5BB5', sw:3.5, hatch:false}); moonPhase(at(g, 0, 0), cs*.26, .75); [[-.3,-.3],[.32,.28],[.3,-.34]].forEach(([x,y]) => sketch(at(g, x*cs, y*cs), starD(cs*.06), {fill:C.sun, sw:1.5, hatch:false, boil:false})); };
    const cards = deck.map((fc, i) => {
      const t = thing(world, ox + (i % cols)*gx, oy + Math.floor(i/cols)*gy); t.fc = fc; t.up = false; t.label = `card ${i+1}`;
      t.flip = el('g', {}, t.core); t.back = el('g', {}, t.flip); t.front = el('g', {style:'display:none'}, t.flip);
      drawBack(t.back); drawFace(t.front, fc); appear(t, i*45);
      return t;
    });
    const turn = async (t, up) => {
      sfx.flip();
      await tween(140, k => t.flip.setAttribute('transform', `scale(${f(1-k)},1)`), lin);
      t.up = up; t.back.style.display = up ? 'none' : ''; t.front.style.display = up ? '' : 'none';
      await tween(140, k => t.flip.setAttribute('transform', `scale(${f(k)},1)`), lin);
      t.flip.removeAttribute('transform');
    };
    let first = null, busy = false, found = 0;
    const hook = () => {
      const open = cards.filter(c => !c.done);
      const target = first ? cards.find(c => c !== first && !c.done && c.fc.id === first.fc.id) : open[0];
      S.q = {answer: target ? target.label : null};
    };
    hook();
    prompt('Find the matching pairs!', mode === 'num' ? 'Flip two cards. Find a number and its matching dots!' : mode === 'abc' ? 'Flip two cards. Find a big letter and its little letter!' : 'Flip two cards to find a match!');
    cards.forEach(c => interact(c, {label:c.label, onTap: async () => {
      if (busy || c.up || c.done || !alive()) return;
      busy = true; await turn(c, true); if (!alive()) return;
      if (!first){ first = c; busy = false; hook(); return; }
      const a = first; first = null;
      if (a.fc.id === c.fc.id){
        a.done = c.done = true; a.locked = c.locked = true; found++;
        sfx.win(); pop(a, .18); pop(c, .18); sparkle(a.x, a.y, 6, cs*.6); sparkle(c.x, c.y, 6, cs*.6);
        const nm = c.fc.kind === 'pic' ? c.fc.v : c.fc.kind === 'up' || c.fc.kind === 'low' ? LETTER[c.fc.v.toUpperCase()] : NUMW[c.fc.v];
        say(`${cap1(nm)}!`, {rate:1});
        await wait(420); a.g.setAttribute('opacity', .55); c.g.setAttribute('opacity', .55);
        if (found === pairsN){ if (!alive()) return; caption('All matched!'); await say('You found them all! Great memory!'); if (alive()) resolve(); return; }
      } else {
        await wait(750); if (!alive()) return;
        await Promise.all([turn(a, false), turn(c, false)]);
      }
      busy = false; hook();
    }}));
  });
}

/* ---- Hide and seek (position words) ---- */
const SPOTS = {table:['on','under','next to'], box:['in','on','next to','behind','in front of']};
function drawScene(g, obj, rel, s){
  const alien = (x, y, k=1) => { const a = at(g, x, y, k); DOODLE.alien(a, s*.2); };
  const W_ = s*.56, H_ = s*.3, gy = s*.3;
  el('path', {d:`M${f(-s*.46)},${f(gy)} L${f(s*.46)},${f(gy)}`, stroke:'rgba(0,0,0,.18)', 'stroke-width':3}, g);
  if (obj === 'table'){
    const tt = gy - H_*1.25;
    const top_ = () => { sketch(at(g, 0, tt), rrD(W_*1.1, s*.06, 3), {fill:C.wood, sw:3, hatch:false}); [-1,1].forEach(k => sketch(at(g, k*W_*.44, (tt + gy)/2 + 2), rrD(s*.05, gy - tt - 4, 2), {fill:C.wood, sw:2.5, hatch:false})); };
    if (rel === 'on'){ top_(); alien(0, tt - s*.17); }
    if (rel === 'under'){ top_(); alien(0, gy - s*.16, .85); }
    if (rel === 'next to'){ top_(); alien(W_*.78, gy - s*.18, .9); }
    return;
  }
  const by = gy - H_/2;
  const box = (open) => { sketch(at(g, 0, by), rrD(W_, H_, 4), {fill:'#E0B07A', sw:3.5}); line(g, `M${f(-W_*.3)},${f(by - H_*.15)} L${f(W_*.3)},${f(by + H_*.2)}`, 'rgba(0,0,0,.2)', 3);
    if (open) sketch(at(g, 0, by - H_/2), ovalD(W_*.5, s*.035), {fill:'#8A5A36', sw:2.5, hatch:false}); };
  if (rel === 'in'){ alien(0, by - H_*.35, .9); box(true); }
  if (rel === 'on'){ box(false); alien(0, by - H_/2 - s*.18); }
  if (rel === 'next to'){ box(false); alien(W_*.78, gy - s*.18, .9); }
  if (rel === 'behind'){ alien(W_*.18, by - H_*.55, .95); box(false); }
  if (rel === 'in front of'){ box(false); alien(0, gy - s*.1, .95); }
}
function playHide(alive){

   ========================================================= */
// Multiple choice: the answer plus up to n-1 distinct wrong candidates. Numbers are compared by value, so
// "8" and "8.0" (or "1,000" and "1000") can never both appear.
const numVal = s => { const t = String(s).replace(/,/g, '').replace(/^\$/, ''); return /^-?\d+(\.\d+)?$/.test(t) ? +t : null; };
function mc(answer, cands, n){
  const out = [answer], vals = [numVal(answer)];
  for (const c of shuffle(cands)){
    if (out.length >= n) break;
    if (c == null || c === '' || out.includes(c)) continue;
    const v = numVal(c); if (v !== null && vals.includes(v)) continue;
    out.push(c); vals.push(v);
  }
  return shuffle(out);
}
// Draws a fresh question: avoids repeating one already asked in this game.
function fresh(gen){
  if (!S.data.seen) S.data.seen = new Set();
  for (let i=0;i<40;i++){ const q = gen(); if (!S.data.seen.has(q.key)){ S.data.seen.add(q.key); return q; } }
  return gen();
}
function panel(parent, x, y, w, hh, fill=C.paper){ return sketch(at(parent,x,y), rrD(w, hh, Math.min(w,hh)*.14), {fill, sw:4, hatch:false}); }
// Center of an HTML element in play-frame coordinates, for sparkles.
function elCenter(e){ const r = frameRect(e); return [r.left + r.width/2, r.top + r.height/2]; }
// A sentence shown big in a paper card. "___" becomes a blank that fills in with the answer.
function sentenceCard(q, A){
  const d = h('div','scard paper'); d.id = 'scard';
  const parts = String(q.s).split(/_{2,}/);
  parts.forEach((t, i) => { d.appendChild(document.createTextNode(t)); if (i < parts.length-1){ const b = h('span','blank'); b.innerHTML = '&nbsp;'; d.appendChild(b); q._blank = b; } });
  ui.appendChild(d);
  const hh = frameRect(d).height;
  if (q.draw){ d.style.top = A.top + 'px'; const nt = A.top + hh + 12; A.top = nt; A.h = Math.max(60, A.bottom - nt); A.y = (nt + A.bottom)/2; }
  else d.style.top = Math.max(A.top, A.y - hh/2) + 'px';
}

    {q:"What is a \"shooting star\" really?", a:"A space rock burning up", w:["A star falling to Earth","A comet hitting the Sun","A planet zooming past"], why:"A shooting star is a meteor. A bit of space rock or dust rushes into our air, heats up, and glows.", pic:"comet"},
    {q:"About how long did Apollo astronauts take to fly to the Moon?", a:"About 3 days", w:["About 3 hours","About 3 months","About 3 years"], why:"The Moon is about 239,000 miles away. The Apollo astronauts got there in about three days.", pic:"rocket"},
    {q:"Why do astronauts float inside the space station?", a:"They fall around Earth", w:["Space has no gravity","Helium fills the station","Magnets push them up"], why:"Gravity still pulls on them! The station and everyone in it keep falling around Earth together, so they float.", pic:"P:Earth"},
    {q:"Which planet is the only one known to have life?", a:"Earth", w:["Mars","Venus","Jupiter"], why:"Earth is the only place where we know life exists. Scientists keep searching for signs of life on other worlds.", pic:"telescope"},
  ],
  4:[
    {q:"What is one full spin of Earth on its axis called?", a:"A rotation", w:["A revolution","An orbit","An eclipse"], why:"One rotation takes about 24 hours. As Earth spins, we get day and night.", pic:"P:Earth"},
    {q:"What is one full trip of Earth around the Sun called?", a:"A revolution", w:["A rotation","A moon phase","An eclipse"], why:"One revolution around the Sun takes about 365 days. That is one year.", pic:"sun"},
    {q:"What is the main reason Earth has seasons?", a:"Earth's tilted axis", w:["Earth's distance from the Sun","Changes in the Sun's heat","The Moon blocking sunlight"], why:"Earth is tilted. When our half leans toward the Sun, sunlight hits more directly and days are longer. That is summer!", pic:"sun"},
    {q:"About how long does the Moon take to go through all its phases?", a:"About a month", w:["About a day","About a week","About a year"], why:"It takes about 29 and a half days to go from one new moon to the next. That is about one month.", pic:"halfmoon"},
    {q:"Which phase do we see when Earth is between the Sun and the Moon?", a:"Full moon", w:["New moon","Crescent moon","Quarter moon"], why:"At full moon, the Moon is on the far side of Earth from the Sun, so its whole sunlit side faces us.", pic:"P:Earth"},
    {q:"What happens during a solar eclipse?", a:"The Moon blocks the Sun", w:["Earth's shadow covers the Moon","The Sun stops shining","Clouds cover the Sun"], why:"The Moon passes between the Sun and Earth and blocks sunlight. Never look at the Sun without special eclipse glasses.", pic:"sun"},
    {q:"What happens during a lunar eclipse?", a:"Earth's shadow covers the Moon", w:["The Moon blocks the Sun","The Moon moves behind the Sun","Clouds cover the Moon"], why:"The Moon moves into Earth's shadow. This can happen only at full moon, and the Moon can even look reddish.", pic:"moon"},
    {q:"Which group lists only rocky planets?", a:"Mercury, Venus, Earth, Mars", w:["Jupiter, Saturn, Uranus, Neptune","Earth, Mars, Jupiter, Saturn","Venus, Earth, Saturn, Uranus"], why:"The four inner planets are rocky. Jupiter and Saturn are gas giants, and Uranus and Neptune are ice giants.", pic:"planet"},
    {q:"What are asteroids?", a:"Rocky objects orbiting the Sun", w:["Icy balls with long tails","Small, faint stars","Clouds of glowing gas"], why:"Asteroids are rocky leftovers from when the planets formed. Most orbit the Sun in the main asteroid belt, between Mars and Jupiter.", pic:"rock"},
    {q:"Which way does a comet's tail point?", a:"Away from the Sun", w:["Toward the Sun","Toward Earth","Always behind the comet"], why:"Sunlight and the solar wind push dust and gas away from the Sun. So the tail points away from the Sun, even when the comet is leaving.", pic:"comet"},
    {q:"About how long does the space station take to circle Earth once?", a:"About 90 minutes", w:["About 24 hours","About a week","About a year"], why:"The space station zooms around Earth about every 90 minutes. The crew sees about 16 sunrises every day!", pic:"P:Earth"},
    {q:"Why do space telescopes like Hubble take such clear pictures?", a:"They are above Earth's air", w:["They are much closer to the stars","Stars are bigger in space","They only work at night"], why:"Earth's moving air blurs starlight, which makes stars twinkle. Space telescopes orbit above the air, so their view is sharper.", pic:"telescope"},
    {q:"How were most craters on the Moon made?", a:"Space rocks crashed into it", w:["Rivers carved them","Astronauts dug them","Moonquakes cracked it"], why:"Asteroids and other space rocks crashed into the Moon and blasted out craters. With no wind or rain, craters can last for billions of years.", pic:"halfmoon"},
    {q:"Where is Olympus Mons, the tallest volcano in the solar system?", a:"On Mars", w:["On Earth","On Venus","On the Moon"], why:"Olympus Mons is a giant volcano on Mars. It is more than twice as tall as Mount Everest, the highest mountain on Earth.", pic:"volcano"},
    {q:"What is Jupiter's Great Red Spot?", a:"A giant storm", w:["A huge volcano","A deep crater","A red ocean"], why:"The Great Red Spot is a giant spinning storm. It is wider than Earth and has been swirling for more than 150 years.", pic:"P:Jupiter"},
  ],
  5:[
    {q:"Why does the Sun look bigger and brighter than other stars?", a:"It is much closer to us", w:["It is the biggest star","It is the hottest star","It is the only real star"], why:"The Sun is an ordinary star. It looks bigger and brighter only because it is much closer to Earth than any other star.", pic:"sun"},
    {q:"Two stars give off the same light. Which looks brighter from Earth?", a:"The closer star", w:["The farther star","Both look the same","The older star"], why:"Light spreads out as it travels. So the closer star looks brighter, even though both give off the same amount of light.", pic:"star"},
    {q:"Compared with other stars, how big is our Sun?", a:"Medium-sized", w:["The biggest of all","The smallest of all","Smaller than Earth"], why:"Our Sun is a medium-sized star. Some stars are hundreds of times wider, and many others are smaller.", pic:"sun"},
    {q:"Which color of star is the hottest?", a:"Blue", w:["Red","Orange","Yellow"], why:"A star's color shows how hot it is. Blue stars are the hottest, and red stars are the coolest.", pic:"thermometer"},
    {q:"What does a light-year measure?", a:"Distance", w:["Time","Brightness","Speed"], why:"A light-year is how far light travels in one year, about 6 trillion miles. It is used to measure distances to stars.", pic:"telescope"},
    {q:"What is the name of our home galaxy?", a:"The Milky Way", w:["Andromeda","The Big Dipper","The Kuiper Belt"], why:"Our solar system is in the Milky Way galaxy. It has billions of stars, and our Sun is just one of them.", pic:"star"},
    {q:"From north of the equator, which star seems to stay in one spot all night?", a:"Polaris, the North Star", w:["Sirius, the Dog Star","Betelgeuse, in Orion","Aldebaran, in Taurus"], why:"Polaris is almost straight above the North Pole. As Earth spins, the other stars seem to circle around it.", pic:"star"},
    {q:"Why do stars seem to move across the sky at night?", a:"Earth is spinning", w:["The stars circle Earth","The Moon pulls them along","Clouds carry them along"], why:"Earth spins toward the east, so stars seem to rise in the east and set in the west, just like the Sun does.", pic:"P:Earth"},
    {q:"Why do we see different constellations in different seasons?", a:"Earth orbits the Sun", w:["The stars orbit Earth","Some stars shut off","The Moon hides some stars"], why:"As Earth travels around the Sun, our night side faces different parts of space. So the night sky changes over the year.", pic:"star"},
    {q:"When is your shadow shortest on a sunny day?", a:"Around midday", w:["Just after sunrise","In the late afternoon","Just before sunset"], why:"Around midday the Sun is highest in the sky, so shadows are short. When the Sun is low, shadows stretch out long.", pic:"sun"},
    {q:"The Sun sets in the west. Which way do shadows point near sunset?", a:"East", w:["West","North","South"], why:"Shadows always point away from the Sun. When the Sun is low in the west, long shadows stretch toward the east.", pic:"sun"},
    {q:"What keeps Earth circling the Sun and the Moon circling Earth?", a:"Gravity", w:["Magnetism","Sunlight","Solar wind"], why:"Gravity pulls Earth toward the Sun and the Moon toward Earth. Without gravity, they would fly off in straight lines.", pic:"P:Earth"},
    {q:"Which planet takes the least time to travel around the Sun?", a:"Mercury", w:["Earth","Jupiter","Neptune"], why:"Mercury is closest to the Sun and moves fastest. It goes around the Sun in only about 88 Earth days.", pic:"sun"},
    {q:"What mainly causes the tides in Earth's oceans?", a:"The Moon's gravity", w:["Wind over the water","Earth's magnetism","Rivers flowing in"], why:"The Moon's gravity pulls on Earth's oceans and makes the water bulge. The Sun's gravity helps a little, too.", pic:"boat"},
    {q:"What is the Sun mostly made of?", a:"Hydrogen and helium gas", w:["Burning coal","Melted rock","Liquid iron"], why:"The Sun is a giant ball of very hot hydrogen and helium. It does not burn like a campfire; it makes energy deep in its core.", pic:"sun"},
  ],
};
// Life science (NGSS K-LS1, 1-LS1, 1-LS3, 2-LS2, 2-LS4, 3-LS1–4, 4-LS1, 5-LS1, 5-LS2).
CONTENT.LIFESCI = {
  1:[
    {q:"What part of a plant takes in water from the soil?", a:"The roots", w:["The flowers","The leaves"], why:"Roots grow down into the soil and soak up water for the whole plant. They also hold the plant in place.", pic:"sprout"},
    {q:"Which part of a plant carries water up to the leaves?", a:"The stem", w:["The flower","The seed"], why:"The stem works like a straw, carrying water up from the roots. It also holds the leaves up toward the light.", pic:"drop"},
    {q:"Which part of a plant uses sunlight to make food?", a:"The leaves", w:["The roots","The seeds"], why:"Leaves catch sunlight and use it to make food. That food gives the whole plant energy to grow.", pic:"sun"},
    {q:"Which part of a plant makes seeds?", a:"The flower", w:["The root","The stem"], why:"Flowers make seeds that can grow into new plants. On an apple tree, the flowers turn into apples with seeds inside."},
    {q:"If you plant an apple seed, what can it grow into?", a:"An apple tree", w:["An oak tree","A pumpkin vine"], why:"A seed grows into the same kind of plant it came from. Acorns grow into oak trees, and pumpkin seeds grow into pumpkin vines.", pic:"apple"},
    {q:"Which of these does every animal need?", a:"Food", w:["Shells","Feathers"], why:"Every animal needs food, water, and air to stay alive. Only some animals have shells or feathers."},
    {q:"A bird builds a nest. What does the nest give the bird?", a:"Shelter", w:["Food","Water"], why:"A shelter is a safe place. A nest keeps eggs and baby birds safe and warm.", pic:"nest"},
    {q:"What does a bird use its beak for?", a:"To pick up food", w:["To fly","To hear"], why:"Birds do not have hands, so they use their beaks to grab food. Beaks come in many shapes to fit the food each bird eats.", pic:"bird"},
    {q:"How does thick fur help an animal?", a:"It keeps it warm", w:["It helps it see","It helps it breathe"], why:"Thick fur holds in body heat, like a cozy coat. It helps animals stay warm in cold places.", pic:"dog"},
    {q:"How does a hard shell help a snail?", a:"It keeps it safe", w:["It helps it find food","It helps it move fast"], why:"A snail can pull its soft body inside its shell. The shell protects it and keeps it from drying out.", pic:"snail"},
    {q:"What does a fish use its fins for?", a:"To swim and steer", w:["To breathe","To eat"], why:"Fins help a fish move, turn, and stay steady in the water. Fish use gills, not fins, to breathe.", pic:"fish"},
    {q:"How do webbed feet help a duck?", a:"They help it swim", w:["They help it see","They keep it warm"], why:"Webbed feet work like paddles. They push against the water so the duck can glide along.", pic:"duck"},
    {q:"How is a kitten different from its mother?", a:"It is smaller", w:["It has no fur","It has more legs"], why:"Young animals look a lot like their parents, but not exactly. A kitten is smaller, and its fur color may be different.", pic:"cat"},
    {q:"Why do many birds sit on their eggs?", a:"To keep them warm", w:["To keep them cold","To crack them open"], why:"The baby birds growing inside need warmth. In some kinds of birds, both parents take turns sitting on the eggs.", pic:"egg"},
    {q:"What do newborn puppies drink?", a:"Milk", w:["Juice","Nectar"], why:"A mother dog makes milk to feed her puppies. Animals that feed their babies milk are called mammals."},
  ],
  2:[
    {q:"A plant gets no water for many days. What will happen to it?", a:"It droops and dries up", w:["It grows taller","It grows more leaves"], why:"Plants need water to stay strong and grow. Without it, the leaves droop and the plant can dry out.", pic:"drop"},
    {q:"A plant is kept in a dark closet for two weeks. What will happen?", a:"It turns pale and weak", w:["It grows big and green","It makes lots of flowers"], why:"Plants need light to make their food. In the dark, a plant cannot make enough food, so it grows pale and weak.", pic:"lightbulb"},
    {q:"How do dandelion seeds travel to new places?", a:"They float on the wind", w:["They roll on the ground","Bees carry them"], why:"Each dandelion seed has a fluffy top, like a tiny parachute. It floats on the breeze to a new spot.", pic:"flower"},
    {q:"How can a coconut travel to a faraway beach?", a:"It floats on the ocean", w:["It blows in the wind","It rides on a bird"], why:"A coconut has a thick, airy husk that helps it float. Waves can carry it to a new shore, where it may sprout."},
    {q:"Some seeds have tiny hooks. How do they travel?", a:"They stick to animal fur", w:["They float on water","They fly on the wind"], why:"Hooked seeds, called burrs, catch on fur or socks. Later they drop off in a new place and can grow there."},
    {q:"A bird eats a berry. How can that help the berry plant?", a:"It spreads the seeds", w:["It waters the plant","It makes it taller"], why:"Berry seeds can pass through a bird and land far away in its droppings. There, they can grow into new plants.", pic:"bird"},
    {q:"What does a bee carry from flower to flower?", a:"Pollen", w:["Seeds","Soil"], why:"Pollen sticks to a bee's fuzzy body. Some rubs off on the next flower, which helps that flower make seeds.", pic:"bee"},
    {q:"What sweet liquid do flowers make that bees and butterflies drink?", a:"Nectar", w:["Honey","Dew"], why:"Flowers make nectar, and bees turn some of it into honey. As animals sip nectar, they carry pollen to other flowers.", pic:"butterfly"},
    {q:"Which animal is well suited to a hot, dry desert?", a:"A camel", w:["A polar bear","A walrus"], why:"Camels can go many days without a drink. Their wide feet spread out on soft sand, so they do not sink.", pic:"sun"},
    {q:"How does a cactus live in a dry desert?", a:"It stores water inside", w:["It drinks from rivers","It grows big leaves"], why:"A cactus saves water in its thick stem. Its sharp spines help keep thirsty animals from taking a bite."},
    {q:"What helps a polar bear stay warm in the Arctic?", a:"Thick fur and fat", w:["Big, thin ears","Short, thin fur"], why:"Polar bears have thick fur and a layer of fat under their skin. Both hold in heat, even in icy wind and water.", pic:"snowflake"},
    {q:"Which habitat is warm and wet, with very tall trees?", a:"A rainforest", w:["A desert","A grassland"], why:"Rainforests get lots of rain. They are home to more kinds of plants and animals than any other land habitat."},
    {q:"Why is a pond a good home for frogs?", a:"It has water and bugs", w:["It is dry and sandy","It is icy all year"], why:"Many frogs lay their eggs in water, where tadpoles hatch and grow. Ponds also have plenty of insects for frogs to catch.", pic:"frog"},
    {q:"Why are forests good homes for so many animals?", a:"Lots of food and shelter", w:["Lots of ice and snow","Lots of sand and salt"], why:"Birds nest in branches, squirrels eat nuts, and insects live in the bark. One tree can be home to many living things.", pic:"tree"},
    {q:"Where would you find octopuses, sea stars, and whales?", a:"In the ocean", w:["In a desert","In a forest"], why:"The ocean is Earth's biggest habitat. It is home to tiny shrimp, giant whales, and everything in between."},
  ],
  3:[
    {q:"What hatches out of a butterfly egg?", a:"A caterpillar", w:["A tiny butterfly","A tadpole","A chrysalis"], why:"A caterpillar, also called a larva, hatches first. It eats and eats so it can grow bigger.", pic:"egg"},
    {q:"In a butterfly's life cycle, what comes after the caterpillar?", a:"The chrysalis", w:["The egg","The tadpole","The seedling"], why:"The chrysalis stage is also called the pupa. Inside it, the caterpillar's body changes into a butterfly.", pic:"caterpillar"},
    {q:"Which shows a frog's life cycle in order?", a:"Egg, tadpole, froglet, frog", w:["Tadpole, egg, frog, froglet","Egg, froglet, tadpole, frog","Frog, tadpole, egg, froglet"], why:"Tadpoles hatch from eggs and breathe with gills. They grow legs, become froglets, and then turn into adult frogs.", pic:"frog"},
    {q:"What do we call a young plant that has just sprouted from a seed?", a:"A seedling", w:["A pupa","A bud","A froglet"], why:"A seedling uses food stored in its seed until its leaves can make food. With light and water, it grows into an adult plant.", pic:"sprout"},
    {q:"After a flower is pollinated, what can part of it grow into?", a:"A fruit with seeds", w:["A new root","A seedling","A leaf"], why:"Part of the flower swells into a fruit that holds the seeds. When a seed is planted, the life cycle starts again.", pic:"flower"},
    {q:"Which trait does a puppy get from its parents?", a:"Its fur color", w:["Its name","Its tricks","Its favorite toy"], why:"Traits like fur color are inherited, or passed down from parents. Names and tricks come from the people who care for the puppy.", pic:"dog"},
    {q:"A pet parrot says \"hello.\" How did it get this behavior?", a:"It learned from people", w:["Its parents passed it on","It was born knowing how"], why:"Parrots copy sounds they hear again and again. Saying hello is a learned behavior, not something passed down from parents.", pic:"bird"},
    {q:"What makes a flamingo's feathers pink?", a:"The food it eats", w:["The hot sun","The cold water","The mud it stands in"], why:"Flamingos eat tiny shrimp and algae with pink and orange coloring in them. Without that food, their feathers slowly fade.", pic:"feather"},
    {q:"How does living in a herd help zebras stay safe?", a:"Many eyes spot danger", w:["They need less food","Their stripes get darker","They never need to sleep"], why:"In a big group, many animals look and listen. When one zebra senses trouble, the whole herd can move away together."},
    {q:"How do honeybees in a colony help one another?", a:"Each bee has a job to do", w:["Each bee lives alone","Every bee lays eggs","They never share food"], why:"The queen lays the eggs. Worker bees gather food, build the hive, and care for the young, so the whole colony survives.", pic:"bee"},
    {q:"What is a fossil?", a:"A sign of life from long ago", w:["A shiny crystal","A rock from space","A cooled blob of lava"], why:"Fossils are the remains or traces of ancient living things, like bones, shells, leaf prints, and footprints in rock.", pic:"rock"},
    {q:"Fossil seashells are found in a dry desert. What does this tell us?", a:"Water once covered it", w:["Seashells grow in sand","Deserts were always dry","Deserts make new shells"], why:"Long ago, sea animals lived there under the water. Fossils help us learn how places on Earth have changed."},
    {q:"A snowshoe hare's fur turns white in winter. How does this help it?", a:"It blends in with snow", w:["It stays cooler","It sees better","It runs faster"], why:"Blending in is called camouflage. A white hare on white snow is hard for foxes and owls to spot."},
    {q:"How do a fennec fox's huge ears help it in the hot desert?", a:"They help it stay cool", w:["They store water","They keep it warm","They help it swim"], why:"Extra body heat escapes through the fox's big ears. The ears also help it hear small animals moving under the sand.", pic:"sun"},
    {q:"Which animal would have the hardest time living in the icy Arctic?", a:"A crocodile", w:["A polar bear","An Arctic fox","A walrus"], why:"Crocodiles need warm weather to stay active. Arctic animals have thick fur or fat that keeps them warm in the cold.", pic:"ice"},
  ],
  4:[
    {q:"What is the main job of your heart?", a:"To pump blood", w:["To take in air","To break down food","To store memories"], why:"Your heart is a strong muscle. With every beat, it pushes blood that carries oxygen and nutrients all around your body.", pic:"heart"},
    {q:"Which organs take oxygen from the air you breathe?", a:"The lungs", w:["The kidneys","The stomach","The heart"], why:"When you breathe in, your lungs fill with air. Oxygen passes from the air into your blood, which carries it everywhere.", pic:"nose"},
    {q:"Which organ is the control center of your body?", a:"The brain", w:["The heart","The lungs","The stomach"], why:"Your brain sends and receives messages through nerves. It controls thinking and moving, and it helps control breathing, too."},
    {q:"What does your skeleton do for your body?", a:"Supports and protects it", w:["Pumps blood through it","Breaks down its food","Sends messages to it"], why:"An adult skeleton has 206 bones. They hold you up, and some, like your skull and ribs, protect the soft organs inside."},
    {q:"How do muscles help you move?", a:"They pull on your bones", w:["They fill bones with air","They make bones longer","They make bones softer"], why:"Tendons connect muscles to bones. When a muscle tightens, it pulls on a bone and moves that part of your body.", pic:"ball"},
    {q:"You touch a warm mug. What carries that feeling to your brain?", a:"Nerves", w:["Bones","Muscles","Blood"], why:"Nerves are like tiny wires that carry messages all through your body. They tell your brain about warmth, cold, touch, and pain.", pic:"hand"},
    {q:"Your ears pick up a sound. Where do they send the message?", a:"To your brain", w:["To your heart","To your stomach","To your lungs"], why:"Your brain figures out what the sound is, like a voice, music, or a dog barking. Then it helps you decide how to respond.", pic:"ear"},
    {q:"What part of your eye lets light in?", a:"The pupil", w:["The eyelash","The eyebrow","The tear duct"], why:"The pupil is the dark opening in the center of your eye. It gets bigger in dim light to let more light in.", pic:"eye"},
    {q:"Why does a snake flick its tongue in and out?", a:"To smell the air", w:["To cool off","To drink water","To clean its teeth"], why:"A snake's tongue picks up tiny bits of scent from the air. A special spot in the roof of its mouth reads the smells."},
    {q:"How do sharp thorns help a plant survive?", a:"They keep animals away", w:["They attract bees","They make seeds","They soak up water"], why:"Thorns make a plant hard to eat. Many hungry animals leave a thorny plant alone and look for an easier meal."},
    {q:"A white flower's cut stem sits in blue water. Soon its petals turn blue. Why?", a:"The stem carried water up", w:["The air turned them blue","The sunlight dyed them","The petals made blue food"], why:"Tiny tubes inside the stem carry water to every part of the plant. The blue color traveled up with the water.", pic:"cup"},
    {q:"Which part of a flower makes pollen?", a:"The stamen", w:["The petal","The pistil","The sepal"], why:"Stamens make pollen. When pollen lands on the pistil, the flower can start making seeds.", pic:"flower"},
    {q:"Why do many flowers have bright, colorful petals?", a:"To attract pollinators", w:["To soak up water","To hold up the stem","To make pollen"], why:"Bright petals and sweet smells invite bees, butterflies, and birds. These visitors carry pollen from flower to flower."},
    {q:"What does a fish use its gills for?", a:"To take in oxygen", w:["To swim faster","To see in the dark","To stay warm"], why:"As water flows over a fish's gills, they pull oxygen out of it. Gills do the same job for fish that lungs do for you.", pic:"fish"},
    {q:"Why do owls have such large eyes?", a:"To see well in dim light", w:["To keep out dust","To help them hear","To stay cool"], why:"Big eyes let in lots of light, so owls can see at dusk and at night. Many owls also have amazing hearing to help them find food.", pic:"bird"},
  ],
  5:[
    {q:"What three things does a plant use to make its own food?", a:"Sunlight, water, and carbon dioxide", w:["Soil, sugar, and oxygen","Moonlight, water, and soil","Sunlight, soil, and oxygen"], why:"Plants use the energy in sunlight to turn water and carbon dioxide into sugar. This process is called photosynthesis.", pic:"leaf"},
    {q:"What gas do plants give off when they make food?", a:"Oxygen", w:["Carbon dioxide","Helium","Neon"], why:"Photosynthesis releases oxygen into the air. Much of the oxygen that people and animals breathe comes from plants and algae.", pic:"tree"},
    {q:"A seed grows into a huge tree. Where did most of its new material come from?", a:"Air and water", w:["Soil","Sunlight","Fertilizer"], why:"Trees build their wood mostly from carbon dioxide in the air, plus water. The soil gives only small amounts of minerals.", pic:"sprout"},
    {q:"What green material in leaves captures sunlight?", a:"Chlorophyll", w:["Pollen","Nectar","Sap"], why:"Chlorophyll is what makes leaves green. It captures energy from sunlight so the plant can make sugar.", pic:"sun"},
    {q:"In an ecosystem, which of these is a producer?", a:"An oak tree", w:["A rabbit","A mushroom","A hawk"], why:"Producers, like trees and grass, make their own food from sunlight. Consumers, like rabbits and hawks, must eat to get energy."},
    {q:"Which of these is a decomposer?", a:"A mushroom", w:["A deer","An oak tree","An owl"], why:"Decomposers, like mushrooms and bacteria, break down dead plants and animals. This returns nutrients to the soil."},
    {q:"Why is a rabbit called a consumer?", a:"It eats other living things", w:["It makes its own food","It breaks down dead things","It gets energy from soil"], why:"Consumers cannot make their own food, so they eat plants or animals. Rabbits eat plants, so they are consumers."},
    {q:"What do we call an animal that eats both plants and animals?", a:"An omnivore", w:["A herbivore","A carnivore","A producer"], why:"Bears and raccoons are omnivores. Herbivores eat mainly plants, and carnivores eat mainly other animals."},
    {q:"In a food chain diagram, what do the arrows show?", a:"Which way energy moves", w:["Where animals sleep","Which animal is biggest","Which way the wind blows"], why:"Each arrow points from a living thing to the one that eats it. That shows energy moving from food to eater."},
    {q:"Where did the energy in your food first come from?", a:"The Sun", w:["The soil","The ocean","The Moon"], why:"Plants capture the Sun's energy and store it in food. When animals eat plants, or eat animals that ate plants, that energy passes along.", pic:"apple"},
    {q:"What is a food web?", a:"A group of linked food chains", w:["A spider's web of food","A list of healthy foods","A map of animal homes"], why:"Most animals eat more than one kind of food. A food web shows all the ways energy moves through an ecosystem."},
    {q:"If all the insects in a pond disappeared, what would likely happen to its frogs?", a:"They would have less food", w:["They would have more food","Nothing would change","They would grow bigger"], why:"Frogs eat insects, so losing them breaks a link in the food web. A change to one living thing can affect many others.", pic:"frog"},
    {q:"What makes up an ecosystem?", a:"Living and nonliving things", w:["Only the animals","Only the plants","Only rocks and water"], why:"An ecosystem includes plants, animals, and tiny living things, plus the water, soil, air, and sunlight they all need."},
    {q:"What would happen if there were no decomposers?", a:"Dead things would pile up", w:["Plants would grow faster","Soil would get richer","Nothing would change"], why:"Decomposers recycle dead leaves and animals into nutrients. Without them, plants would run short of the nutrients they need.", pic:"leaf"},
    {q:"Animals breathe out a gas that plants use to make food. Which gas is it?", a:"Carbon dioxide", w:["Oxygen","Helium","Nitrogen"], why:"Animals breathe out carbon dioxide, and plants take it in. Plants give off oxygen, which animals breathe in.", pic:"nose"},
