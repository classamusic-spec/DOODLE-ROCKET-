    const it = pick(AFFIX);
    const q = {key:it.a, cap:`Which word means "${it.m}"?`, spoken:`Which word means ${it.m}?`, answer:it.a, choices:shuffle([it.a, ...it.w]), explain:it.why,
      hint: c => `${cap1(c)} doesn't mean ${it.m}. Look at the beginning and end of each word.`};
    q.draw = (w, A) => {
      const s = `“${it.m}”`, fs = clamp(Math.min(A.w/(s.length*.55+2), A.h*.28), 26, 64);
      panel(w, W/2, A.y - fs*.4, Math.min(W-30, s.length*fs*.55 + fs*2), fs*1.8); txt(w, s, fs, {x:W/2, y:A.y - fs*.4});
      txt(w, 'un- = not   re- = again   -ful = full of   -less = without', clamp(A.w/34, 14, 22), {hand:true, fill:C.paper, x:W/2, y:A.y + fs*1.2});
    };
    return q;
  }
  const [word, s, len, opts] = pick(LAB[g]);
  const miss = word.slice(s, s+len);
  const q = {key:word, cap:'Fill in the missing sound!', spoken:`${word}. What is missing in ${word}?`, answer:miss, choices:shuffle(opts),
    explain:`${cap1(word)}! ${word.toUpperCase().split('').join(', ')}.`, hint: () => `Listen: ${word}. Say it slowly.`, quietCap:true};
  q.draw = (w, A) => {
    const pic = DOODLE[word] ? word : null, n = word.length;
    const ts = clamp(Math.min((W-40)/(n*1.18), A.h*(pic ? .3 : .5)), 40, 92);
    const ty = pic ? A.y + A.h*.2 : A.y;
    if (pic){ const pr = Math.min(A.h*.2, 80); const pc = thing(w, W/2, ty - ts*.55 - pr - 8); pc.inner.classList.add('bob'); DOODLE[pic](pc.core, pr); }
    const { xs } = rowXs(n, ts, ts*.18);
    q._tiles = []; q._ts = ts;
    for (let i=0;i<n;i++){
      const tg = at(w, xs[i], ty), blank = i>=s && i<s+len;
      if (blank){ sketch(tg, rrD(ts, ts*1.1, ts*.16), {stroke:C.paper, sw:3.5, dash:'3 9'}); q._tiles.push({tg, i}); }
      else { sketch(tg, rrD(ts, ts*1.1, ts*.16), {fill:C.paper, sw:3.5, hatch:false}); txt(tg, word[i], ts*.66); }
    }
  };
  q.onRight = () => q._tiles.forEach(({tg, i}) => { tg.innerHTML=''; sketch(tg, rrD(q._ts, q._ts*1.1, q._ts*.16), {fill:C.sun, sw:3.5, hatch:false}); txt(tg, word[i], q._ts*.66); });
  return q;
}

/* Sight word stars: Dolch 1st, 2nd, 3rd grade lists (RF.1.3g, RF.2.3f, RF.3.3d) */
const SIGHT = {
  1:['after','again','any','ask','by','could','every','fly','from','give','going','had','has','her','him','his','how','just','know','let','live','may','of','old','once','open','over','put','round','some','stop','take','thank','them','then','think','walk','were','when'],
  2:['always','around','because','been','before','best','both','buy','call','cold','does','fast','first','five','found','gave','goes','green','its','made','many','off','pull','read','right','sing','sit','sleep','tell','their','these','those','upon','us','use','very','wash','which','why','wish','work','would','write','your'],
  3:['about','better','bring','carry','clean','done','draw','drink','eight','fall','far','full','got','grow','hold','hot','hurt','keep','kind','laugh','light','long','much','myself','never','only','own','pick','seven','shall','show','small','start','today','together','try','warm'],
};
function qSight(g){
  const L = SIGHT[g], w = pick(L);
  const same = shuffle(L.filter(x => x!==w && x[0]===w[0])), rest = shuffle(L.filter(x => x!==w && x[0]!==w[0]));
  const choices = shuffle([w, ...[...same.slice(0,2), ...rest].slice(0, g===1 ? 2 : 3)]);
  const voiceOn = S.voice && HAS_TTS;
  return {key:w, cap: voiceOn ? 'Listen, then find the word!' : `Find the word "${w}"`, spoken:`Find the word: ${w}. ${w}.`, answer:w, choices,
    explain:`That says ${w}!`, hint: c => `That word is ${c}. Listen: ${w}.`, quietCap:true, draw:speakerPlanet};
}

/* Spell check: choose the correct spelling (L.1.2d, L.2.2d, L.3.2e–f) */
const SPELL = {
  1:[['ship','shep','sip'],['frog','forg','frogg'],['duck','duk','dukc'],['jump','jupm','jum'],['bell','bel','bele'],['sock','sok','soc'],['nest','nesd','nst'],['drum','durm','drom'],['fox','foks','fosk'],['this','thes','tis']],
  2:[['rain','rane','rayn'],['boat','bote','boet'],['kite','kiet','kyte'],['cake','caek','cak'],['snow','sno','snoe'],['green','grean','gren'],['cloud','clowd','cluod'],['bright','brite','brigt'],['night','nite','niht'],['float','flote','flot']],
  3:[['planet','plannet','planit'],['orbit','orbet','orbitt'],['rocket','roket','rockit'],['gravity','gravaty','gravitty'],['because','becuz','becose'],['comet','comett','comit'],['astronaut','astronot','astronaught'],['surface','surfase','serface'],['different','diffrent','diferent'],['answer','anser','answere']],
};
function qSpell(g){
  const [w, ...bad] = pick(SPELL[g]);
  return {key:w, cap:'Which spelling is right?', spoken:`Spell ${w}. Which is the right way to spell ${w}?`, answer:w, choices:shuffle([w, ...bad]),
    explain:`${cap1(w)} is spelled ${w.toUpperCase().split('').join(', ')}.`, hint: () => `Not quite. Listen carefully: ${w}.`, quietCap:true, draw:speakerPlanet};
}

/* Space reader: short original passages + comprehension (RL/RI.1.1, RI.2.1, RL.2.5, RI.3.1, RI.3.8) */
const READ = {
  1:[
    {text:"Pip has a red rocket. The rocket can fly up, up, up! Pip flies to the Moon. The Moon is gray and bumpy.", q:"What color is Pip's rocket?", a:'Red', w:['Blue','Green'], why:'The story says Pip has a red rocket.'},
    {text:"Mo the alien has three eyes. Mo likes to hop on the Moon. Hop, hop, hop! Mo hops into a big hole. A big hole on the Moon is called a crater.", q:'What is a big hole on the Moon called?', a:'A crater', w:['A comet','A cookie'], why:'The story says a big hole on the Moon is called a crater.'},
    {text:"At night, Kim looks up. She sees the Moon and lots of stars. In the day, she sees the Sun. The Sun is a star too!", q:'What does Kim see in the day?', a:'The Sun', w:['The Moon','Lots of stars'], why:'The story says that in the day, she sees the Sun.'},
  ],
  2:[
    {text:"Pip packed for a trip to Mars. First, she put on her space suit. Next, she checked her air tank. Last, she climbed into the rocket and buckled her belt.", q:'What did Pip do right after she put on her space suit?', a:'Checked her air tank', w:['Climbed into the rocket','Buckled her belt'], why:'The story says first the suit, next the air tank.'},
    {text:"Saturn is a giant planet made mostly of gas. You could not stand on it! Its rings are made of chunks of ice and rock. Some chunks are as small as grains of sand. Others are as big as a house.", q:"What are Saturn's rings made of?", a:'Chunks of ice and rock', w:['Ribbons of light','Clouds of smoke'], why:'The story says the rings are made of chunks of ice and rock.'},
    {text:"Zed the alien planted a moon garden. He watered it every day, but nothing grew. Then Pip said, \"Plants need sunlight!\" Zed moved his garden to a sunny crater. Soon, tiny green sprouts popped up.", q:"Why did Zed's garden grow at the end?", a:'It got sunlight', w:['He watered it more','Pip sang to it'], why:'The garden grew after Zed moved it into the sunlight.'},
  ],
  3:[
    {text:"Astronauts on the International Space Station can see about sixteen sunrises every day. The station zooms around Earth so fast that it circles the whole planet about once every ninety minutes. Each lap brings a new sunrise and a new sunset.", q:'Why do the astronauts see so many sunrises?', a:'The station circles Earth very quickly', w:['The Sun rises more often in space','They sleep all day'], why:'Each fast lap around Earth brings a new sunrise.'},
    {text:"Maya wanted to know if every planet has a moon. She read that Earth has one moon and Mars has two tiny ones. Jupiter and Saturn each have dozens. But Mercury and Venus have none at all. \"So the answer is no,\" Maya wrote in her notebook.", q:'What did Maya find out?', a:'Not every planet has a moon', w:['Every planet has two moons','Only Earth has a moon'], why:'Mercury and Venus have no moons, so not every planet has one.'},
    {text:"The footprints astronauts left on the Moon in 1969 are probably still there today. On Earth, wind and rain would wipe footprints away. But the Moon has almost no air, so there is no wind or rain to erase them.", q:'What is the main reason the footprints are still there?', a:'The Moon has no wind or rain', w:['Astronauts protect them','The Moon is very cold'], why:'With no wind or rain, nothing wipes the footprints away.'},
  ],
};
function playReader(alive){
  const g = gr();
  if (!S.data.pass) S.data.pass = shuffle(READ[g]);
  const p = S.data.pass[S.round % S.data.pass.length];
  return quiz(alive, {key:p.q, cap:'Read, then answer!', spoken:`${p.text} ... ${p.q}`, answer:p.a, choices:shuffle([p.a, ...p.w]), explain:p.why,
    hint: () => 'Not quite. Look back at the story!',
    draw: (w, A) => {
      const d = h('div','paper passage interactive'); d.id = 'passage';
      d.style.top = (TOP - 6) + 'px'; d.style.maxHeight = Math.max(120, A.h + 4) + 'px';
      const t1 = h('p'); t1.textContent = p.text; const t2 = h('p','q'); t2.textContent = p.q;
      d.append(t1, t2); ui.appendChild(d);
    }});
}

/* =========================================================
   Celebration, parent gate, settings
   ========================================================= */
function celebrate(key){
  sid++; S.screen = 'party';
  const G = GAMES[key];
  const st = S.data.sticker ? {...S.data.sticker} : {type:G.sticker};
  st.rot = f(rnd(-18,18));
  S.stickers.push(st);
  sfx.fanfare();
  const ov = h('div','overlay'); ov.id='party';
  const cols = [C.sun, C.gum, C.mint, C.sky, C.tomato, C.lilac];
  for (let i=0;i<28;i++){
    const c = h('div','confetti'), col = pick(cols), sz = rnd(14,26);
    c.innerHTML = pick([
      `<svg width="${sz}" height="${sz}" viewBox="-12 -12 24 24"><path d="${starD(11)}" fill="${col}" stroke="#2B2A33" stroke-width="1.5"/></svg>`,
      `<svg width="${sz*1.6}" height="${sz}" viewBox="0 0 32 20"><path d="M2 10 q5 -9 10 0 t10 0 t8 0" fill="none" stroke="${col}" stroke-width="4" stroke-linecap="round"/></svg>`,
      `<svg width="${sz*.7}" height="${sz*.7}" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="${col}"/></svg>`]);
    c.style.left = rnd(0,100)+'vw'; c.style.animationDuration = rnd(2.2,4)+'s'; c.style.animationDelay = rnd(0,.8)+'s';
    ov.appendChild(c);
  }
  const sheet = h('div','sheet paper');
  const svg = el('svg', {id:'sticker-svg', viewBox:'-110 -110 220 220'});
  drawSticker(svg, st, 95);
  sheet.appendChild(svg);
  sheet.appendChild(h('h2', null, 'You got a sticker!'));
  const row = h('div','row');
  const mk = (icon, label, fn) => { const w = h('div','bigbtn'); const b = h('button','paper', icon); b.setAttribute('aria-label', label); b.onclick = () => { unlockAudio(); fn(); }; w.appendChild(b); w.appendChild(h('span', null, label)); return w; };
  row.appendChild(mk(ICON.again, 'Again', () => startGame(key)));
  row.appendChild(mk(ICON.home, 'Home', () => hub()));
  sheet.appendChild(row);
  ov.appendChild(sheet);
  ui.appendChild(ov);
  say('Hooray! You earned a sticker!');
}
function gearButton(){
  const b = h('button','paper', ICON.gear); b.id='gear';
  b.setAttribute('aria-label','Grown-up settings. Press and hold for 3 seconds.');
  let t = null;
  const start = e => { e.preventDefault(); e.stopPropagation(); b.classList.add('holding'); t = setTimeout(() => { t=null; b.classList.remove('holding'); openPanel(); }, 3000); };
  const stop = () => { if (t){ clearTimeout(t); t=null; b.classList.remove('holding'); showTip(); } };
  b.addEventListener('pointerdown', start);
  ['pointerup','pointerleave','pointercancel'].forEach(ev => b.addEventListener(ev, stop));
  b.addEventListener('keydown', e => { if (e.key==='Enter') openPanel(); });
  b.addEventListener('contextmenu', e => e.preventDefault());
  ui.appendChild(b);
}
function showTip(){
  if (document.getElementById('tip')) return;
  const t = h('div','paper','Grown-ups: hold for 3 seconds'); t.id='tip'; ui.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function openPanel(){
  const ov = h('div','overlay'); ov.id='panel'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Grown-up settings');
  const sh = h('div','sheet paper');
  const render = () => {
    sh.innerHTML = '';
    sh.appendChild(h('h2', null, 'Grown-up settings'));
    const group = (label, opts, cur, set) => {
      sh.appendChild(h('p','lbl',label));
      const seg = h('div','seg');
      opts.forEach(([v, t]) => { const b = h('button','opt', t); b.setAttribute('aria-pressed', String(cur===v)); b.onclick = () => { set(v); render(); }; seg.appendChild(b); });
      sh.appendChild(seg);
    };
    group('Level', LEVELS, S.level, v => { setLevel(v); S.page = v.startsWith('g') ? 5 : Math.min(S.page, 4); });
    group('Sound effects', [[true,'On'],[false,'Off']], S.sound, v => S.sound = v);
    group('Voice', [[true,'On'],[false,'Off']], S.voice, v => S.voice = v);
    sh.appendChild(h('p','lbl',"Child's name, for the Name tag game"));
    const inp = document.createElement('input'); inp.value = S.name; inp.maxLength = 8; inp.placeholder = 'Letters only'; inp.setAttribute('aria-label',"Child's name");
    inp.oninput = () => { S.name = inp.value.toUpperCase().replace(/[^A-Z]/g,'').slice(0,8); };
    sh.appendChild(inp);
    sh.appendChild(h('p','note', `Stickers earned: ${S.stickers.length}. All eight map pages are open in this prototype; the last three hold the Grade 1–3 games. Swipe or use the arrows to change pages.` + (HAS_TTS ? '' : ' This browser has no built-in voice, so instructions show as captions only.')));
    const d = h('button','opt done','Done'); d.onclick = () => { ov.remove(); if (S.screen==='hub') hub(); }; sh.appendChild(d);
  };
  render(); ov.appendChild(sh); ui.appendChild(ov);
  ov.addEventListener('pointerdown', e => { if (e.target === ov) ov.remove(); });
}

/* =========================================================
   Boot & resize
   ========================================================= */
function layout(){
  W = innerWidth; H = innerHeight;
  stage.setAttribute('viewBox', `0 0 ${W} ${H}`);
  drawSky();
}
let rt = null;
addEventListener('resize', () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    if (innerWidth === W && innerHeight === H) return;
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    layout();
    if (S.screen==='start') startScreen();
    else if (S.screen==='hub') hub();
    else if (S.screen==='game') startGame(S.gameKey, true);
  }, 250);
});
layout();
startScreen();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (S.screen==='start') startScreen(); });
window.DoodleRocket = {startGame, hub, startScreen, S, GAMES, PAGES, LEVELS};
})();
